<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Emil</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100svh;background:#020610;overflow:hidden;
    font-family:ui-serif, Georgia, "Times New Roman", serif;
  }
  .escena{
    position:relative;height:100svh;width:100%;overflow:hidden;
    /* mismo degradado que el jardin: el resplandor queda abajo, como un horizonte */
    background:radial-gradient(95% 68% at 50% 92%, #10303f 0%, #08192a 45%, #020610 100%);
  }
  .escena::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(76% 60% at 50% 52%, rgba(2,6,16,0) 52%, rgba(2,6,16,.5) 100%);
  }

  .estrella{
    position:absolute;border-radius:50%;background:#fff;
    will-change:transform,opacity;
    animation:titilar 5.5s ease-in-out infinite;
  }
  @keyframes titilar{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.85;transform:scale(1.25)}}

  .luz{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:#e2f2ff;box-shadow:0 0 10px 3px rgba(190,225,255,.5);
    opacity:0;will-change:transform,opacity;
    animation:flotar 13s ease-in-out infinite;
  }
  @keyframes flotar{
    0%{opacity:0;transform:translate(0,0)}
    15%{opacity:.8}70%{opacity:.35}
    100%{opacity:0;transform:translate(55px,-190px)}
  }

  svg.lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}

  /* ---------- particulas ---------- */
  .particula{
    transform-box:fill-box;transform-origin:50% 50%;
    transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0;
    animation:armar 1.5s cubic-bezier(.16,.86,.22,1) var(--d) forwards;
  }
  /* una parte late; una parte mas pequena ademas flota. el resto queda quieto:
     asi el conjunto respira sin repintar 600 nodos por frame */
  .particula.viva{
    will-change:opacity;
    animation:armar 1.5s cubic-bezier(.16,.86,.22,1) var(--d) forwards,
              pulso var(--t) ease-in-out var(--tp) infinite;
  }
  .particula.flota{
    will-change:transform,opacity;
    animation:armar 1.5s cubic-bezier(.16,.86,.22,1) var(--d) forwards,
              pulso var(--t) ease-in-out var(--tp) infinite,
              deriva var(--dv) ease-in-out var(--tp) infinite;
  }
  @keyframes armar{
    0%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}
    14%{opacity:1}
    74%{transform:translate(0,0) scale(1.5)}
    100%{transform:translate(0,0) scale(1);opacity:1}
  }
  /* arranca en 1 para engancharse sin salto con el final de armar */
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes deriva{
    0%,100%{transform:translate(0,0) scale(1)}
    25%{transform:translate(var(--ax),var(--ay)) scale(1.08)}
    50%{transform:translate(calc(var(--ax) * -.7), calc(var(--ay) * .85)) scale(.94)}
    75%{transform:translate(calc(var(--ax) * .45), calc(var(--ay) * -.8)) scale(1.04)}
  }

  /* polvo ambiental: da atmosfera al fondo sin anadir ninguna luz que no sea una particula */
  .ambiente{
    transform-box:fill-box;transform-origin:50% 50%;
    opacity:0;will-change:transform,opacity;
    animation:entrarAmb 3s ease-out var(--d) forwards,
              vagar var(--dv) ease-in-out var(--d) infinite;
  }
  @keyframes entrarAmb{to{opacity:var(--o)}}

  /* polvo desenfocado en primer plano: da profundidad de camara */
  .bokeh{
    transform-box:fill-box;transform-origin:50% 50%;
    opacity:0;will-change:transform,opacity;
    animation:entrarBokeh 2.4s ease-out var(--d) forwards,
              vagar var(--dv) ease-in-out var(--d) infinite;
  }
  @keyframes entrarBokeh{to{opacity:var(--o)}}
  @keyframes vagar{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(var(--ax),var(--ay)) scale(1.12)}
    66%{transform:translate(calc(var(--ax) * -.8), calc(var(--ay) * -.5)) scale(.9)}
  }

  /* brasas que se escapan hacia arriba */
  .polvo{
    will-change:transform,opacity;opacity:0;
    animation:subir var(--v) ease-out var(--d) infinite;
  }
  @keyframes subir{
    0%{opacity:0;transform:translate(0,0) scale(.3)}
    12%{opacity:.9}
    70%{opacity:.35}
    100%{opacity:0;transform:translate(var(--sx),-300px) scale(.08)}
  }

  /* ---------- arranque ---------- */
  .disparador{
    position:absolute;inset:0;z-index:6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;
    background:transparent;border:0;cursor:pointer;
    font-family:inherit;-webkit-tap-highlight-color:transparent;
  }
  .brasa{
    width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #fff 0%, #cfe9ff 32%, #4d8fe0 66%, rgba(27,71,168,0) 100%);
    box-shadow:0 0 20px 7px rgba(160,210,255,.5), 0 0 56px 20px rgba(120,180,255,.22);
    will-change:transform,opacity;
    animation:brasear 1.7s ease-in-out infinite;
  }
  @keyframes brasear{
    0%,100%{transform:scale(.78);opacity:.68}
    18%{transform:scale(1.18);opacity:1}
    40%{transform:scale(.94);opacity:.84}
  }
  .pista{
    font-size:clamp(.85rem,2.9vw,1.05rem);
    font-style:italic;letter-spacing:.08em;
    color:#a6c8dd;text-shadow:0 0 22px rgba(150,205,255,.5);
    will-change:opacity;animation:respirarPista 2.6s ease-in-out infinite;
  }
  @keyframes respirarPista{0%,100%{opacity:.34}50%{opacity:.92}}
  .disparador.fuera{pointer-events:none;animation:salir .55s ease-out forwards}
  @keyframes salir{to{opacity:0;transform:scale(1.9)}}

  .chispazo{
    will-change:transform,opacity;
    animation:estallar 1.1s cubic-bezier(.1,.7,.25,1) var(--d) forwards;
  }
  @keyframes estallar{
    0%{opacity:0;transform:translate(0,0) scale(.3)}
    12%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}
  }

  /* ---------- texto ---------- */
  .mensaje{
    position:absolute;z-index:5;
    left:env(safe-area-inset-left);right:env(safe-area-inset-right);
    top:calc(5vh + env(safe-area-inset-top));
    text-align:center;padding:0 7vw;
  }
  .mensaje p{opacity:0;transform:translateY(16px)}
  .activo .mensaje p{animation:emerger 2.2s cubic-bezier(.16,.7,.2,1) var(--r) forwards}
  @keyframes emerger{to{opacity:1;transform:translateY(0)}}

  /* jerarquia: la afirmacion pesa, la razon acompana, la promesa se acerca */
  /* mismo cuerpo, cursiva y halo azul que el jardin */
  .mensaje p{
    font-size:clamp(1rem,3.7vw,1.6rem);line-height:1.6;
    font-style:italic;color:#eef8ff;
    text-shadow:0 0 30px rgba(150,205,255,.35);
  }
  .l1{--r:4.6s}
  .l2{--r:5.7s;margin-top:.72rem}
  .l3{--r:7s;margin-top:1.5rem;color:#c9e2f2}

  .contador{
    position:absolute;z-index:5;left:0;right:0;
    bottom:calc(12.5vh + env(safe-area-inset-bottom));
    text-align:center;opacity:0;
  }
  .activo .contador{animation:emerger 1.8s ease-out 8.4s forwards}
  .rotulo{
    font-size:clamp(.85rem,2.9vw,1.05rem);
    font-style:italic;letter-spacing:.06em;color:#a6c8dd;
    text-shadow:0 0 22px rgba(150,205,255,.4);
  }
  .cifra{
    margin-top:.5rem;
    font-size:clamp(2.1rem,9vw,3.4rem);line-height:1;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
    letter-spacing:.01em;color:#eef8ff;
    text-shadow:0 0 12px rgba(255,255,255,.45), 0 0 34px rgba(150,205,255,.75), 0 0 70px rgba(80,160,255,.45);
  }

  .firma{
    position:absolute;z-index:5;left:0;right:0;
    bottom:calc(4.4vh + env(safe-area-inset-bottom));
    text-align:center;
    font-size:clamp(.85rem,2.9vw,1.05rem);
    color:#a6c8dd;letter-spacing:.08em;opacity:0;
  }
  .activo .firma{animation:aparecer 2.4s ease-out 9.8s forwards}
  .firma span{display:block;margin-top:.35rem}
  @keyframes aparecer{to{opacity:1}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}
    .particula{transform:none;opacity:1}
    .bokeh,.ambiente{opacity:var(--o);transform:none}
    .polvo,.chispazo{opacity:0}
    .mensaje p,.contador{opacity:1;transform:none}
    .firma{opacity:1}
    .disparador.fuera{display:none}
  }
</style>
</head>
<body>
<div class="escena">

  <button class="disparador" id="disparador" aria-label="Toca para empezar">
    <span class="brasa"></span>
    <span class="pista">toca la luz</span>
  </button>

  <div class="mensaje">
    <p class="l1">No espero un día especial para quererte.</p>
    <p class="l2">Contigo cualquier día lo es.</p>
    <p class="l3">Y no voy a dejar que lo olvides, mi príncipe.</p>
  </div>

  <div class="contador">
    <div class="rotulo">Como crece mi amor por ti</div>
    <div class="cifra" id="cifra">0</div>
  </div>

  <div class="firma">
    Para: Emil
    <span>De: Tom</span>
  </div>

  <svg class="lienzo" viewBox="0 0 400 740" preserveAspectRatio="xMidYMid meet" aria-label="Un corazón de polvo de luz que se arma y late">
    <defs>
      <!-- cada particula brilla por su gradiente: nada de feGaussianBlur -->
      <!-- g0 lirio blanco, g1 lirio azul, g2 hortensia, g3 oro del estambre -->
      <radialGradient id="g0">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="26%"  stop-color="#eafaff" stop-opacity=".92"/>
        <stop offset="58%"  stop-color="#a9e2d8" stop-opacity=".32"/>
        <stop offset="100%" stop-color="#dbfff7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g1">
        <stop offset="0%"   stop-color="#eaf5ff" stop-opacity="1"/>
        <stop offset="24%"  stop-color="#5d94dc" stop-opacity=".95"/>
        <stop offset="58%"  stop-color="#1b47a8" stop-opacity=".34"/>
        <stop offset="100%" stop-color="#12327c" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g2">
        <stop offset="0%"   stop-color="#f4faff" stop-opacity="1"/>
        <stop offset="22%"  stop-color="#8fb8ff" stop-opacity=".92"/>
        <stop offset="56%"  stop-color="#3c63c9" stop-opacity=".34"/>
        <stop offset="100%" stop-color="#3559b8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g3">
        <stop offset="0%"   stop-color="#fffdf0" stop-opacity="1"/>
        <stop offset="26%"  stop-color="#f2dd8e" stop-opacity=".9"/>
        <stop offset="60%"  stop-color="#c9a94f" stop-opacity=".3"/>
        <stop offset="100%" stop-color="#c9a94f" stop-opacity="0"/>
      </radialGradient>
      <!-- particula desenfocada: sin nucleo duro -->
      <radialGradient id="gb">
        <stop offset="0%"   stop-color="#8fc4ff" stop-opacity=".62"/>
        <stop offset="42%"  stop-color="#2f6fd6" stop-opacity=".3"/>
        <stop offset="100%" stop-color="#12327c" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g id="ambiente"></g>
    <g id="corazon">
      <g id="dentro"></g>
      <g id="borde"></g>
    </g>
    <g id="bokeh"></g>
    <g id="estallido"></g>
    <g id="polvo"></g>
  </svg>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}) => { const n = document.createElementNS(NS, t); for (const k in a) if (a[k] != null) n.setAttribute(k, a[k]); return n; };
const rnd = (a, b) => a + Math.random() * (b - a);
const escena = document.querySelector('.escena');
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;

for (let i = 0; i < 110; i++) {
  const s = document.createElement('div'); s.className = 'estrella';
  const t = rnd(1, 2.1);
  s.style.cssText = `left:${rnd(0,100)}%;top:${rnd(0,96)}%;width:${t}px;height:${t}px;animation-delay:${rnd(0,5.5).toFixed(2)}s`;
  escena.appendChild(s);
}

for (let i = 0; i < 16; i++) {
  const l = document.createElement('div'); l.className = 'luz';
  l.style.cssText = `left:${rnd(2,98)}%;top:${rnd(45,88)}%;animation-delay:${rnd(0,13).toFixed(2)}s`;
  escena.appendChild(l);
}

/* polvo ambiental: se ve ya en la pantalla de arranque */
const ambiente = document.querySelector('#ambiente');
for (let i = 0; i < 34; i++) {
  const a = el('circle', {
    cx: rnd(0, 400).toFixed(1), cy: rnd(0, 740).toFixed(1),
    r: rnd(.6, 1.7).toFixed(2),
    fill: i % 4 ? 'url(#g2)' : 'url(#g0)', class: 'ambiente'
  });
  a.style.setProperty('--o', rnd(.16, .45).toFixed(2));
  a.style.setProperty('--d', rnd(0, 3).toFixed(2) + 's');
  a.style.setProperty('--ax', rnd(-14, 14).toFixed(1) + 'px');
  a.style.setProperty('--ay', rnd(-18, -4).toFixed(1) + 'px');
  a.style.setProperty('--dv', rnd(14, 30).toFixed(1) + 's');
  ambiente.appendChild(a);
}

/* ---------- geometria ---------- */
const CX = 200, CY = 344, K = 10.6;
const ANCLA = { x: CX, y: CY + 2 * K };
function pto(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x: CX + x * K, y: CY - y * K };
}
/* mitad del contorno, naciendo siempre en la punta de abajo (t = PI) */
function ladoD(hasta) {
  let d = '';
  for (let i = 0; i <= 110; i++) {
    const p = pto(Math.PI + (hasta - Math.PI) * (i / 110));
    d += (i ? ' L' : 'M') + p.x.toFixed(2) + ',' + p.y.toFixed(2);
  }
  return d;
}
/* poligono del contorno: reparte el relleno sin costuras */
const POLI = [];
for (let i = 0; i < 240; i++) POLI.push(pto((i / 240) * 2 * Math.PI));
function dentroDe(x, y) {
  let d = false;
  for (let i = 0, j = POLI.length - 1; i < POLI.length; j = i++) {
    if ((POLI[i].y > y) !== (POLI[j].y > y) &&
        x < (POLI[j].x - POLI[i].x) * (y - POLI[i].y) / (POLI[j].y - POLI[i].y) + POLI[i].x) d = !d;
  }
  return d;
}

/* ---------- una mota de luz ---------- */
/* un solo nodo por mota: posicion en cx/cy, animacion en CSS, para que el
   atributo transform y el transform de CSS no se pisen */
/* la onda de luz: todas comparten periodo y solo cambia la fase segun la altura,
   asi el brillo viaja de la punta de abajo hacia arriba en vez de parpadear al azar */
const Y_ABAJO = CY + 17 * K, Y_ARRIBA = CY - 9.56 * K;
const ONDA_T0 = 4.3, ONDA_P = 4.2;

function mota(x, y, r, tono, retraso, op) {
  const c = el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(2), fill: `url(#g${tono})`, opacity: op.toFixed(2) });

  const s = Math.random();
  const clase = s < .17 ? 'particula flota' : (s < .45 ? 'particula viva' : 'particula');
  c.setAttribute('class', clase);

  const ang = rnd(0, Math.PI * 2), dist = rnd(170, 500);
  c.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
  c.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
  c.style.setProperty('--d', retraso.toFixed(2) + 's');
  if (clase !== 'particula') {
    const h = Math.min(1, Math.max(0, (Y_ABAJO - y) / (Y_ABAJO - Y_ARRIBA)));
    c.style.setProperty('--t', ONDA_P + 's');
    c.style.setProperty('--tp', (ONDA_T0 + h * ONDA_P).toFixed(2) + 's');
  }
  if (clase === 'particula flota') {
    c.style.setProperty('--ax', rnd(-3.4, 3.4).toFixed(2) + 'px');
    c.style.setProperty('--ay', rnd(-3.4, 3.4).toFixed(2) + 'px');
    c.style.setProperty('--dv', rnd(7, 15).toFixed(1) + 's');
  }
  return c;
}

/* ---------- construir: solo al tocar ---------- */
function armar() {
  const borde = document.querySelector('#borde');
  const dentro = document.querySelector('#dentro');
  const bokeh = document.querySelector('#bokeh');
  const polvo = document.querySelector('#polvo');

  const INI = 0.35, DUR = 2.1;

  /* contorno: dos guias invisibles solo para repartir a distancia igual */
  [0, 2 * Math.PI].forEach((hasta, lado) => {
    const guia = el('path', { d: ladoD(hasta), fill: 'none', stroke: 'none' });
    borde.appendChild(guia);
    const L = guia.getTotalLength();

    const N = 170;
    for (let i = 0; i < N; i++) {
      const u = (i + .5) / N;
      const p = guia.getPointAtLength(L * u);

      // dispersion perpendicular: el borde es una nube, no un hilo
      let ox = p.x - ANCLA.x, oy = p.y - ANCLA.y;
      const m = Math.hypot(ox, oy) || 1; ox /= m; oy /= m;
      const fuera = rnd(-4, 5.5);

      const gorda = i % 7 === 3;
      borde.appendChild(mota(
        p.x + ox * fuera, p.y + oy * fuera,
        gorda ? rnd(2.6, 4) : rnd(1.2, 2.4),
        gorda ? 3 : (i % 2 ? 1 : (i % 5 ? 2 : 0)),
        INI + DUR * u + rnd(0, .16), 1
      ));
    }
    guia.remove();
  });

  /* relleno: polvo repartido al azar dentro de la silueta, del centro hacia afuera */
  const M = 300;
  let puestas = 0, intentos = 0;
  while (puestas < M && intentos < M * 40) {
    intentos++;
    const x = rnd(CX - 16.2 * K, CX + 16.2 * K);
    const y = rnd(CY - 10 * K, CY + 17.2 * K);
    if (!dentroDe(x, y)) continue;
    const rr = Math.min(1, Math.hypot(x - ANCLA.x, y - ANCLA.y) / (15 * K));
    dentro.appendChild(mota(
      x, y, rnd(.9, 2),
      puestas % 13 === 0 ? 3 : (puestas % 6 === 0 ? 0 : (puestas % 2 ? 1 : 2)),
      1.2 + rr * 1.6 + rnd(0, .3),
      rnd(.5, .95)
    ));
    puestas++;
  }

  /* primer plano desenfocado: profundidad de camara.
     va fuera del grupo que late, para que no escale con el corazon */
  for (let i = 0; i < 22; i++) {
    const b = el('circle', {
      cx: rnd(30, 370).toFixed(1), cy: rnd(230, 560).toFixed(1),
      r: rnd(7, 19).toFixed(1), fill: 'url(#gb)', class: 'bokeh'
    });
    b.style.setProperty('--o', rnd(.06, .15).toFixed(2));
    b.style.setProperty('--d', (2.6 + rnd(0, 2.5)).toFixed(2) + 's');
    b.style.setProperty('--ax', rnd(-9, 9).toFixed(1) + 'px');
    b.style.setProperty('--ay', rnd(-11, -3).toFixed(1) + 'px');
    b.style.setProperty('--dv', rnd(11, 22).toFixed(1) + 's');
    bokeh.appendChild(b);
  }

  /* brasas que se escapan */
  for (let i = 0; i < 26; i++) {
    const t = rnd(0, 2 * Math.PI), r = rnd(.2, .95);
    const b = pto(t);
    const c = el('circle', {
      cx: (ANCLA.x + (b.x - ANCLA.x) * r).toFixed(1),
      cy: (ANCLA.y + (b.y - ANCLA.y) * r).toFixed(1),
      r: rnd(.7, 1.7).toFixed(2),
      fill: i % 3 ? '#cfe6ff' : '#fff8dc', class: 'polvo'
    });
    c.style.setProperty('--d', (4 + rnd(0, 8)).toFixed(2) + 's');
    c.style.setProperty('--v', rnd(6, 11).toFixed(1) + 's');
    c.style.setProperty('--sx', rnd(-40, 40).toFixed(0) + 'px');
    polvo.appendChild(c);
  }

  /* el contador que no para de crecer */
  const cifra = document.getElementById('cifra');
  const fmt = new Intl.NumberFormat('es-MX');
  if (quieto) {
    cifra.textContent = fmt.format(999999999);
  } else {
    let n = 0;
    setTimeout(() => {
      const paso = () => {
        n += Math.round(rnd(1400, 4200));   // desbocado a proposito
        cifra.textContent = fmt.format(n);
        requestAnimationFrame(paso);
      };
      requestAnimationFrame(paso);
    }, 8600);
  }
}

/* ---------- el toque: la brasa estalla y de ahi nace el corazon ---------- */
const disparador = document.getElementById('disparador');

function estallar() {
  const estallido = document.querySelector('#estallido');
  for (let i = 0; i < 54; i++) {
    const ang = (i / 54) * Math.PI * 2 + rnd(-.12, .12);
    const dist = rnd(180, 500);
    const c = el('circle', {
      cx: 200, cy: 383, r: rnd(.8, 1.9).toFixed(2),
      fill: i % 4 ? '#cfe9ff' : '#fff', class: 'chispazo'
    });
    c.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    c.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
    c.style.setProperty('--d', rnd(0, .12).toFixed(3) + 's');
    estallido.appendChild(c);
  }
}

let encendido = false;
disparador.addEventListener('click', () => {
  if (encendido) return;
