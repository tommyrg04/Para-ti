<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Emil</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100svh;background:#000;overflow:hidden;
    font-family:ui-serif, Georgia, "Times New Roman", serif;
  }
  .escena{
    position:relative;height:100svh;width:100%;overflow:hidden;
    background:#000;
  }

  /* ---------- fondo ---------- */
  .estrella{
    position:absolute;border-radius:50%;background:#fff;
    will-change:transform,opacity;
    animation:titilar 5.5s ease-in-out infinite;
  }
  @keyframes titilar{0%,100%{opacity:.08;transform:scale(.6)}50%{opacity:.62;transform:scale(1.2)}}

  .mota{
    position:absolute;width:2.5px;height:2.5px;border-radius:50%;
    background:#ff9fb2;box-shadow:0 0 10px 3px rgba(255,80,110,.45);
    opacity:0;will-change:transform,opacity;
    animation:flotar 13s ease-in-out infinite;
  }
  @keyframes flotar{
    0%{opacity:0;transform:translate(0,0)}
    18%{opacity:.7}70%{opacity:.28}
    100%{opacity:0;transform:translate(38px,-225px)}
  }

  svg.lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}

  /* ---------- particulas: llegan volando y se quedan formando el corazon ---------- */
  .particula{
    transform-box:fill-box;transform-origin:50% 50%;
    transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0;
    animation:armar 1.5s cubic-bezier(.16,.86,.22,1) var(--d) forwards;
  }
  /* solo una parte sigue latiendo despues: menos repintado por frame */
  .particula.viva{
    will-change:transform,opacity;
    animation:armar 1.5s cubic-bezier(.16,.86,.22,1) var(--d) forwards,
              pulso var(--t) ease-in-out var(--tp) infinite;
  }
  @keyframes armar{
    0%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}
    14%{opacity:1}
    74%{transform:translate(0,0) scale(1.5)}
    100%{transform:translate(0,0) scale(1);opacity:1}
  }
  /* arranca en 1 para engancharse sin salto con el final de armar */
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.34}}

  /* ---------- latido ---------- */
  .latido{
    transform-box:view-box;transform-origin:200px 373px;
    will-change:transform;
    animation:latir 2.4s ease-in-out 3.9s infinite;
  }
  @keyframes latir{
    0%{transform:scale(1)}
    6%{transform:scale(1.085)}
    13%{transform:scale(1.022)}
    20%{transform:scale(1.058)}
    36%{transform:scale(1)}
    100%{transform:scale(1)}
  }

  .polvo{
    will-change:transform,opacity;opacity:0;
    animation:subir 6.5s ease-out var(--d) infinite;
  }
  @keyframes subir{
    0%{opacity:0;transform:translateY(0) scale(.3)}
    14%{opacity:.95}
    72%{opacity:.4}
    100%{opacity:0;transform:translateY(-265px) scale(.1)}
  }

  /* ---------- pantalla de arranque ---------- */
  .disparador{
    position:absolute;inset:0;z-index:6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
    background:transparent;border:0;cursor:pointer;
    font-family:inherit;-webkit-tap-highlight-color:transparent;
  }
  .brasa{
    width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #fff 0%, #ff506e 38%, #d1002a 72%, rgba(160,0,25,0) 100%);
    box-shadow:0 0 22px 8px rgba(255,25,65,.55), 0 0 60px 22px rgba(255,20,60,.28);
    will-change:transform,opacity;
    animation:brasear 1.7s ease-in-out infinite;
  }
  @keyframes brasear{
    0%,100%{transform:scale(.82);opacity:.72}
    18%{transform:scale(1.16);opacity:1}
    40%{transform:scale(.95);opacity:.86}
  }
  .pista{
    font-size:clamp(.82rem,2.9vw,1rem);
    font-style:italic;letter-spacing:.22em;text-transform:lowercase;
    color:#ffb9c6;text-shadow:0 0 20px rgba(255,60,95,.6);
    will-change:opacity;animation:respirarPista 2.6s ease-in-out infinite;
  }
  @keyframes respirarPista{0%,100%{opacity:.42}50%{opacity:.95}}
  .disparador.fuera{pointer-events:none;animation:salir .55s ease-out forwards}
  @keyframes salir{to{opacity:0;transform:scale(1.9)}}

  .chispazo{
    will-change:transform,opacity;
    animation:estallar 1.1s cubic-bezier(.1,.7,.25,1) var(--d) forwards;
  }
  @keyframes estallar{
    0%{opacity:0;transform:translate(0,0) scale(.3)}
    12%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}
  }

  /* ---------- texto ---------- */
  .mensaje{
    position:absolute;z-index:2;
    left:env(safe-area-inset-left);right:env(safe-area-inset-right);
    top:calc(3.6vh + env(safe-area-inset-top));
    text-align:center;padding:0 8vw;color:#fff2f4;
  }
  .mensaje p{
    font-size:clamp(.95rem,3.6vw,1.46rem);
    line-height:1.55;font-style:italic;letter-spacing:.012em;
    opacity:0;transform:translateY(14px);
    text-shadow:0 0 30px rgba(255,60,95,.55);
  }
  .activo .mensaje p{animation:emerger 2.1s cubic-bezier(.16,.7,.2,1) var(--r) forwards}
  .mensaje p + p{margin-top:.85rem}
  .mensaje p.uno{--r:4.6s}
  .mensaje p.dos{--r:5.7s}
  .mensaje p.tres{--r:6.8s}
  @keyframes emerger{to{opacity:1;transform:translateY(0)}}

  .contador{
    position:absolute;z-index:2;left:0;right:0;
    bottom:calc(14vh + env(safe-area-inset-bottom));
    text-align:center;opacity:0;
  }
  .activo .contador{animation:emerger 1.6s ease-out 8s forwards}
  .rotulo{
    font-size:clamp(.8rem,2.9vw,1.02rem);
    font-style:italic;color:#ffc3ce;letter-spacing:.05em;
    text-shadow:0 0 22px rgba(255,60,95,.5);
  }
  .cifra{
    margin-top:.42rem;
    font-size:clamp(2rem,8.6vw,3.2rem);
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,.55), 0 0 34px rgba(255,40,80,.85), 0 0 62px rgba(255,20,60,.6);
  }

  .firma{
    position:absolute;z-index:2;left:0;right:0;
    bottom:calc(4.2vh + env(safe-area-inset-bottom));
    text-align:center;
    font-size:clamp(.82rem,2.8vw,1rem);
    color:#ffb9c6;letter-spacing:.16em;text-transform:uppercase;
    opacity:0;
  }
  .activo .firma{animation:aparecer 2.2s ease-out 9.4s forwards}
  .firma span{display:block;margin-top:.4rem;color:#d78e9e;letter-spacing:.2em}
  @keyframes aparecer{to{opacity:1}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}
    .particula{transform:none;opacity:1}
    .latido{transform:none}
    .polvo,.chispazo{opacity:0}
    .mensaje p,.contador{opacity:1;transform:none}
    .firma{opacity:1}
    .disparador.fuera{display:none}
  }
</style>
</head>
<body>
<div class="escena">

  <button class="disparador" id="disparador" aria-label="Toca para empezar">
    <span class="brasa"></span>
    <span class="pista">toca la luz</span>
  </button>

  <div class="mensaje">
    <p class="uno">Contigo no hay días comunes: todos se vuelven especiales.</p>
    <p class="dos">Por eso no espero una fecha para quererte; mi amor no entiende de calendarios.</p>
    <p class="tres">Y nunca voy a dejar que olvides el cariño que te tengo, mi príncipe.</p>
  </div>

  <div class="contador">
    <div class="rotulo">Como crece mi amor por ti</div>
    <div class="cifra" id="cifra">0</div>
  </div>

  <div class="firma">
    Para: Emil
    <span>De: Tom</span>
  </div>

  <svg class="lienzo" viewBox="0 0 400 740" preserveAspectRatio="xMidYMid meet" aria-label="Un corazón de partículas de luz que se arma y late">
    <defs>
      <!-- cada particula brilla por su gradiente: nada de feGaussianBlur -->
      <radialGradient id="g0">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="26%"  stop-color="#ffd0d8" stop-opacity=".92"/>
        <stop offset="58%"  stop-color="#ff2d55" stop-opacity=".34"/>
        <stop offset="100%" stop-color="#ff0a34" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g1">
        <stop offset="0%"   stop-color="#ffdfe4" stop-opacity="1"/>
        <stop offset="24%"  stop-color="#ff2d55" stop-opacity=".95"/>
        <stop offset="58%"  stop-color="#e00028" stop-opacity=".34"/>
        <stop offset="100%" stop-color="#a8001f" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g2">
        <stop offset="0%"   stop-color="#fff2f4" stop-opacity="1"/>
        <stop offset="22%"  stop-color="#ff4767" stop-opacity=".92"/>
        <stop offset="56%"  stop-color="#ff0a34" stop-opacity=".34"/>
        <stop offset="100%" stop-color="#c1001f" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g id="corazon">
      <g id="dentro"></g>
      <g id="borde"></g>
    </g>
    <g id="estallido"></g>
    <g id="polvo"></g>
  </svg>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}) => { const n = document.createElementNS(NS, t); for (const k in a) if (a[k] != null) n.setAttribute(k, a[k]); return n; };
const rnd = (a, b) => a + Math.random() * (b - a);
const escena = document.querySelector('.escena');
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- fondo ---------- */
for (let i = 0; i < 70; i++) {
  const s = document.createElement('div'); s.className = 'estrella';
  const t = rnd(1, 2.2);
  s.style.cssText = `left:${rnd(0,100)}%;top:${rnd(0,94)}%;width:${t}px;height:${t}px;animation-delay:${rnd(0,5.5).toFixed(2)}s`;
  escena.appendChild(s);
}
for (let i = 0; i < 12; i++) {
  const m = document.createElement('div'); m.className = 'mota';
  m.style.cssText = `left:${rnd(4,96)}%;top:${rnd(50,94)}%;animation-delay:${rnd(0,13).toFixed(2)}s`;
  escena.appendChild(m);
}

/* ---------- geometria ---------- */
const CX = 200, CY = 339, K = 9.2;
const ANCLA = { x: CX, y: CY + 2 * K };
function pto(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x: CX + x * K, y: CY - y * K };
}
/* mitad del contorno, naciendo siempre en la punta de abajo (t = PI) */
function ladoD(hasta) {
  let d = '';
  for (let i = 0; i <= 110; i++) {
    const p = pto(Math.PI + (hasta - Math.PI) * (i / 110));
    d += (i ? ' L' : 'M') + p.x.toFixed(2) + ',' + p.y.toFixed(2);
  }
  return d;
}

/* poligono del contorno: sirve para repartir el relleno sin costuras */
const POLI = [];
for (let i = 0; i < 240; i++) POLI.push(pto((i / 240) * 2 * Math.PI));
function dentroDe(x, y) {
  let d = false;
  for (let i = 0, j = POLI.length - 1; i < POLI.length; j = i++) {
    if ((POLI[i].y > y) !== (POLI[j].y > y) &&
        x < (POLI[j].x - POLI[i].x) * (y - POLI[i].y) / (POLI[j].y - POLI[i].y) + POLI[i].x) d = !d;
  }
  return d;
}

/* ---------- una particula de luz ---------- */
/* un solo nodo por particula: posicion en cx/cy, animacion en CSS.
   asi no chocan el atributo transform y el transform de CSS. */
function particula(x, y, r, tono, retraso, op, viva) {
  const c = el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(2), fill: `url(#g${tono})`, opacity: op });
  c.setAttribute('class', viva ? 'particula viva' : 'particula');

  const ang = rnd(0, Math.PI * 2), dist = rnd(160, 470);
  c.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
  c.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
  c.style.setProperty('--d', retraso.toFixed(2) + 's');
  if (viva) {
    c.style.setProperty('--t', rnd(1.8, 3.8).toFixed(2) + 's');
    c.style.setProperty('--tp', (retraso + 1.5).toFixed(2) + 's');   // engancha al acabar de llegar
  }
  return c;
}

/* ---------- construir: solo al tocar ---------- */
function armar() {
  const borde = document.querySelector('#borde');
  const dentro = document.querySelector('#dentro');
  const polvo = document.querySelector('#polvo');

  const INI = 0.35, DUR = 2.1;

  /* contorno: dos rutas invisibles solo para repartir las particulas a distancia igual */
  [0, 2 * Math.PI].forEach((hasta, lado) => {
    const guia = el('path', { d: ladoD(hasta), fill: 'none', stroke: 'none' });
    borde.appendChild(guia);
    const L = guia.getTotalLength();

    const N = 170;
    for (let i = 0; i < N; i++) {
      const u = (i + .5) / N;
      const p = guia.getPointAtLength(L * u);

      // dispersion perpendicular para que el borde no sea un hilo perfecto
      let ox = p.x - ANCLA.x, oy = p.y - ANCLA.y;
      const m = Math.hypot(ox, oy) || 1; ox /= m; oy /= m;
      const fuera = rnd(-3.5, 4);

      const gorda = i % 7 === 3;
      borde.appendChild(particula(
        p.x + ox * fuera, p.y + oy * fuera,
        gorda ? rnd(2.6, 4) : rnd(1.2, 2.4),
        gorda ? 0 : (i % 2 ? 1 : 2),
        INI + DUR * u + rnd(0, .16),
        1,
        Math.random() < .3
      ));
    }
    guia.remove();
  });

  /* relleno: polvo repartido al azar dentro de la silueta, del centro hacia afuera */
  const M = 300;
  let puestas = 0, intentos = 0;
  while (puestas < M && intentos < M * 40) {
    intentos++;
    const x = rnd(CX - 16.2 * K, CX + 16.2 * K);
    const y = rnd(CY - 10 * K, CY + 17.2 * K);
    if (!dentroDe(x, y)) continue;
    const rr = Math.min(1, Math.hypot(x - ANCLA.x, y - ANCLA.y) / (15 * K));
    dentro.appendChild(particula(
      x, y, rnd(.9, 2),
      puestas % 6 === 0 ? 0 : (puestas % 2 ? 1 : 2),
      1.2 + rr * 1.6 + rnd(0, .3),
      rnd(.5, .95),
      Math.random() < .3
    ));
    puestas++;
  }

  /* brasas subiendo */
  for (let i = 0; i < 18; i++) {
    const t = rnd(0, 2 * Math.PI), r = rnd(.2, .95);
    const b = pto(t);
    const c = el('circle', {
      cx: (ANCLA.x + (b.x - ANCLA.x) * r).toFixed(1),
      cy: (ANCLA.y + (b.y - ANCLA.y) * r).toFixed(1),
      r: rnd(.9, 2).toFixed(2),
      fill: i % 3 ? '#ff8fa4' : '#fff0f3',
      class: 'polvo'
    });
    c.style.setProperty('--d', (4.4 + rnd(0, 6.5)).toFixed(2) + 's');
    polvo.appendChild(c);
  }

  /* el contador que no para de crecer */
  const cifra = document.getElementById('cifra');
  const fmt = new Intl.NumberFormat('es-MX');
  if (quieto) {
    cifra.textContent = fmt.format(999999999);
  } else {
    let n = 0;
    setTimeout(() => {
      const paso = () => {
        n += Math.round(rnd(1400, 4200));   // desbocado a proposito
        cifra.textContent = fmt.format(n);
        requestAnimationFrame(paso);
      };
      requestAnimationFrame(paso);
    }, 8200);
  }
}

/* ---------- el toque: la brasa estalla y de ahi nace el corazon ---------- */
const disparador = document.getElementById('disparador');

function estallar() {
  const estallido = document.querySelector('#estallido');
  for (let i = 0; i < 54; i++) {
    const ang = (i / 54) * Math.PI * 2 + rnd(-.12, .12);
    const dist = rnd(170, 470);
    const c = el('circle', {
      cx: 200, cy: 373, r: rnd(.8, 1.9).toFixed(2),
      fill: i % 4 ? '#ff5c78' : '#fff', class: 'chispazo'
    });
    c.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    c.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
    c.style.setProperty('--d', rnd(0, .12).toFixed(3) + 's');
    estallido.appendChild(c);
  }
}

let encendido = false;
disparador.addEventListener('click', () => {
  if (encendido) return;
  encendido = true;
  disparador.classList.add('fuera');
  escena.classList.add('activo');
  document.querySelector('#corazon').classList.add('latido');
  if (!quieto) estallar();
  armar();
});
</script>
</body>
</html>
