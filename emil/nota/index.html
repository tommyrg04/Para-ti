<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F3">
<title>Para Emil</title>
<style>
  :root{
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    --papel:#FFFDFC;
    --fondo:#FAF6F3;
    --tinta:#2A2522;
    --gris:#867C76;
    --tenue:#AFA49D;
    --rosa:#C58E96;
    --rosa-suave:#FBF0F0;
    --linea:rgba(42,37,34,.10);
    --ease:cubic-bezier(.22,.68,.24,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden}

  body{
    min-height:100svh;
    display:grid;place-items:center;
    padding:calc(env(safe-area-inset-top) + 1.1rem) 1.2rem calc(env(safe-area-inset-bottom) + 1.1rem);
    background:
      radial-gradient(56% 32% at 80% 4%, #FDF1F1 0%, rgba(253,241,241,0) 70%),
      radial-gradient(50% 30% at 12% 94%, #F6F0EC 0%, rgba(246,240,236,0) 72%),
      var(--fondo);
    background-attachment:fixed;
    font-family:var(--sans);color:var(--tinta);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  .tarjeta{
    width:100%;max-width:23.5rem;
    background:var(--papel);border:1px solid var(--linea);border-radius:22px;
    padding:1.6rem 1.6rem 1.7rem;text-align:center;
    box-shadow:0 1px 2px rgba(42,37,34,.04), 0 34px 64px -38px rgba(42,37,34,.4);
    opacity:0;transform:translate3d(0,14px,0);
    animation:entrar 1.1s var(--ease) .1s forwards;
  }
  @keyframes entrar{to{opacity:1;transform:none}}

  .etiqueta{
    font-size:.58rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
    text-indent:.3em;color:var(--tenue);
  }

  /* ---------------- el ramo ---------------- */
  .ramo{
    display:block;width:100%;height:auto;
    margin:.5rem auto .2rem;
    max-width:19rem;
  }
  /* cada flor: el grupo de fuera coloca, el de dentro anima */
  .flor{
    transform-box:fill-box;transform-origin:50% 50%;
    transform:scale(.04);opacity:0;
    animation:florecer 1s cubic-bezier(.18,1.16,.3,1) var(--d) forwards;
  }
  @keyframes florecer{
    0%{transform:scale(.04) rotate(-22deg);opacity:0}
    45%{opacity:1}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  .hoja{
    transform-box:fill-box;transform-origin:0% 50%;
    transform:scale(.06);opacity:0;
    animation:brotar .85s var(--ease) var(--d) forwards;
  }
  @keyframes brotar{to{transform:scale(1);opacity:.95}}
  .pieza{opacity:0;animation:surgir .9s var(--ease) var(--d) forwards}
  @keyframes surgir{to{opacity:1}}
  .cinta{
    stroke-dasharray:var(--l);stroke-dashoffset:var(--l);
    animation:trazar 1.5s var(--ease) var(--d) forwards;
  }
  @keyframes trazar{to{stroke-dashoffset:0}}

  /* ---------------- caras ---------------- */
  .caras{display:grid;margin:.9rem 0 1.1rem}
  .cara{grid-area:1/1;transition:opacity .7s var(--ease), transform .7s var(--ease)}

  .cara--cerrada{display:flex;flex-direction:column;align-items:center;gap:.9rem}
  .abierta .cara--cerrada{opacity:0;transform:translate3d(0,-8px,0);pointer-events:none}

  .susurro{font-family:var(--serif);font-size:.95rem;color:var(--tenue);font-style:italic}

  .pista{
    font-family:var(--sans);
    font-size:.62rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
    color:var(--rosa);background:var(--rosa-suave);
    border:1px solid #F0DDDE;border-radius:999px;
    min-height:44px;padding:.7rem 1.2rem;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .4s var(--ease);
  }
  .pista:active{transform:scale(.96)}
  .pista:focus-visible{outline:2px solid var(--rosa);outline-offset:3px}

  .cara--nota{opacity:0;transform:translate3d(0,12px,0);pointer-events:none}
  .abierta .cara--nota{opacity:1;transform:none;pointer-events:auto}

  .linea{
    font-family:var(--serif);font-weight:400;
    font-size:clamp(1.02rem,4.2vw,1.18rem);
    line-height:1.58;letter-spacing:-.006em;
    opacity:0;transform:translate3d(0,10px,0);
    transition:opacity 1s var(--ease), transform 1s var(--ease);
  }
  .linea + .linea{margin-top:.7rem}
  .l2{color:var(--gris)}
  .abierta .l1{opacity:1;transform:none;transition-delay:.3s}
  .abierta .l2{opacity:1;transform:none;transition-delay:1.05s}
  .abierta .l3{opacity:1;transform:none;transition-delay:1.8s}

  .regla{height:1px;background:var(--linea);transform:scaleX(0);
         transition:transform 1.1s var(--ease) 2.5s}
  .abierta .regla{transform:scaleX(1)}

  .firma{
    margin-top:1.1rem;
    font-size:.6rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;
    text-indent:.28em;color:var(--tenue);
    opacity:0;transition:opacity 1.2s var(--ease) 2.9s;
  }
  .abierta .firma{opacity:1}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;animation-iteration-count:1 !important;
      animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important;
    }
    .tarjeta{opacity:1;transform:none}
    .flor{transform:scale(1);opacity:1}
    .hoja{transform:scale(1);opacity:.95}
    .pieza{opacity:1}
    .cinta{stroke-dashoffset:0}
  }
</style>
</head>
<body>

<article class="tarjeta" id="tarjeta">
  <p class="etiqueta">Para Emil</p>

  <svg class="ramo" viewBox="0 0 300 300" role="img" aria-label="Un ramo de lirios rosas envuelto en papel">
    <defs>
      <linearGradient id="papelA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#FBD8E3"/>
        <stop offset="55%"  stop-color="#F3B4CA"/>
        <stop offset="100%" stop-color="#E28FAD"/>
      </linearGradient>
      <linearGradient id="papelB" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#FFEAF1"/>
        <stop offset="100%" stop-color="#F5C0D4"/>
      </linearGradient>

      <!-- el pétalo va pálido: el color lo pone la banda de dentro -->
      <linearGradient id="tepalo" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#F3A9C4"/>
        <stop offset="32%"  stop-color="#FBDCE9"/>
        <stop offset="78%"  stop-color="#FFF3F8"/>
        <stop offset="100%" stop-color="#FFFFFF"/>
      </linearGradient>
      <linearGradient id="banda" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#CE2E6B"/>
        <stop offset="18%"  stop-color="#DE3D77"/>
        <stop offset="55%"  stop-color="#EF7FA8"/>
        <stop offset="100%" stop-color="#F8B9D0" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="tepaloAtras" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#E28FAF"/>
        <stop offset="58%"  stop-color="#F7CCDF"/>
        <stop offset="100%" stop-color="#FFEFF5"/>
      </linearGradient>

      <linearGradient id="capullo" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#9FBB6E"/>
        <stop offset="50%"  stop-color="#DCE8BC"/>
        <stop offset="100%" stop-color="#F7E4EA"/>
      </linearGradient>
      <linearGradient id="verdeG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#5E8F4E"/>
        <stop offset="100%" stop-color="#22431F"/>
      </linearGradient>
      <radialGradient id="hondo" cx="50%" cy="48%">
        <stop offset="0%"   stop-color="#2C3D22" stop-opacity=".82"/>
        <stop offset="58%"  stop-color="#33482A" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#3C5330" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="cintaG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#F6DCDF"/>
        <stop offset="100%" stop-color="#DFAFBC"/>
      </linearGradient>
    </defs>

    <g id="papelAtras"></g>
    <g id="verde"></g>
    <g id="capullos"></g>
    <g id="flores"></g>
    <g id="papelFrente"></g>
    <g id="base"></g>
  </svg>

  <div class="caras">
    <div class="cara cara--cerrada">
      <p class="susurro">Te traje flores que no se marchitan.</p>
      <button class="pista" id="abrir" type="button">toca para abrir la nota</button>
    </div>

    <div class="cara cara--nota" role="note">
      <p class="linea l1">No esperé una fecha especial: eres tú.</p>
      <p class="linea l2">Este es el último detalle que te mando siendo lo que somos hoy.</p>
      <p class="linea l3">El próximo llega cuando seas mi novio.</p>
    </div>
  </div>

  <div class="regla" aria-hidden="true"></div>
  <p class="firma">— Tom</p>
</article>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, a) => { const n = document.createElementNS(NS, t); for (const k in (a||{})) if (a[k]!=null) n.setAttribute(k, a[k]); return n; };
  const rnd = (a, b) => a + Math.random() * (b - a);

  const papelAtras  = document.querySelector('#papelAtras');
  const verde       = document.querySelector('#verde');
  const capullos    = document.querySelector('#capullos');
  const flores      = document.querySelector('#flores');
  const papelFrente = document.querySelector('#papelFrente');
  const base        = document.querySelector('#base');

  const pieza = (nodo, retraso) => {
    nodo.setAttribute('class', 'pieza');
    nodo.style.setProperty('--d', retraso + 's');
    return nodo;
  };

  /* ---------- tépalo ----------
     Tres capas: la forma pálida, la banda rosa que se apaga hacia la punta y
     las pecas de la garganta. El color va en la banda, no en el relleno del
     pétalo: así se ve un lirio oriental de verdad. */
  const D_TEPALO     = 'M0,0 C 7,-9 11,-21 10,-35 C 9.5,-47 5,-58 0,-68 C -5,-58 -9.5,-47 -10,-35 C -11,-21 -7,-9 0,0 Z';
  const D_TEPALO_EXT = 'M0,0 C 6,-9 9.5,-21 8.5,-36 C 8,-48 4,-59 0,-70 C -4,-59 -8,-48 -8.5,-36 C -9.5,-21 -6,-9 0,0 Z';
  const D_BANDA      = 'M0,-2 C 4.4,-12 6.4,-25 5.8,-39 C 5.4,-48 2.8,-54 0,-59 C -2.8,-54 -5.4,-48 -5.8,-39 C -6.4,-25 -4.4,-12 0,-2 Z';

  function tepalo(angulo, externo) {
    const g = el('g', { transform: `rotate(${angulo})` });
    g.appendChild(el('path', { d: externo ? D_TEPALO_EXT : D_TEPALO,
                               fill: externo ? 'url(#tepaloAtras)' : 'url(#tepalo)' }));
    if (!externo) {
      g.appendChild(el('path', { d: D_BANDA, fill: 'url(#banda)', opacity: .95 }));
      g.appendChild(el('path', { d: 'M0,-4 C 1,-20 1,-40 0,-58', stroke: '#FADAE6',
                                 'stroke-width': .8, fill: 'none', opacity: .75 }));
      [[2.8,-11],[-3,-15],[3.6,-19],[-2,-23],[2.8,-27],[-3.6,-30],[1.6,-34],[-2.4,-37]]
        .forEach(([px,py]) => g.appendChild(el('ellipse', {
          cx: px, cy: py, rx: 1, ry: 1.6, fill: '#A81E56', opacity: .6 })));
    }
    return g;
  }

  function lirio(x, y, s, giro, retraso) {
    const wrap = el('g', { transform: `translate(${x},${y}) rotate(${giro}) scale(${s})` });
    const g = el('g', { class: 'flor' });
    g.style.setProperty('--d', retraso.toFixed(2) + 's');
    for (let i = 0; i < 3; i++) g.appendChild(tepalo(i * 120 + 60, true));
    for (let i = 0; i < 3; i++) g.appendChild(tepalo(i * 120, false));
    for (let i = 0; i < 6; i++) {
      const e = el('g', { transform: `rotate(${i * 60 + 30})` });
      e.appendChild(el('path', { d: 'M0,-2 C 3,-14 7,-25 12,-32', stroke: '#F7EEDF',
                                 'stroke-width': 1.1, fill: 'none' }));
      e.appendChild(el('ellipse', { cx: 13.4, cy: -33.4, rx: 1.8, ry: 4.4, fill: '#A9552A',
                                    transform: 'rotate(38 13.4 -33.4)' }));
      g.appendChild(e);
    }
    g.appendChild(el('path', { d: 'M0,-2 C -1,-14 -1.5,-26 -1.5,-36', stroke: '#F3F7E4',
                               'stroke-width': 1.5, fill: 'none' }));
    g.appendChild(el('ellipse', { cx: -1.5, cy: -37.5, rx: 2.4, ry: 1.9, fill: '#C7A65C' }));
    g.appendChild(el('circle', { r: 4.8, fill: '#C6D98F', opacity: .92 }));
    g.appendChild(el('circle', { r: 2.2, fill: '#8CB35B', opacity: .85 }));
    wrap.appendChild(g);
    return wrap;
  }

  function capullo(x, y, s, giro, retraso) {
    const wrap = el('g', { transform: `translate(${x},${y}) rotate(${giro}) scale(${s})` });
    const g = el('g', { class: 'flor' });
    g.style.setProperty('--d', retraso.toFixed(2) + 's');
    g.appendChild(el('path', {
      d: 'M0,0 C 6,-7 8.5,-22 6,-38 C 4.6,-47 2,-52 0,-55 C -2,-52 -4.6,-47 -6,-38 C -8.5,-22 -6,-7 0,0 Z',
      fill: 'url(#capullo)' }));
    g.appendChild(el('path', { d: 'M0,-3 C 1.4,-20 1.4,-40 0,-53', stroke: '#9DB868',
                               'stroke-width': .9, fill: 'none', opacity: .6 }));
    wrap.appendChild(g);
    return wrap;
  }

  function hoja(x, y, giro, s, retraso) {
    const wrap = el('g', { transform: `translate(${x},${y}) rotate(${giro}) scale(${s})` });
    const g = el('g', { class: 'hoja' });
    g.style.setProperty('--d', retraso.toFixed(2) + 's');
    g.appendChild(el('path', { d: 'M0,0 C 16,-9 44,-11 66,-2 C 44,7 16,9 0,0 Z', fill: 'url(#verdeG)' }));
    g.appendChild(el('path', { d: 'M3,0 C 22,-2 46,-3 62,-2', stroke: '#8CB877',
                               'stroke-width': .8, fill: 'none', opacity: .5 }));
    wrap.appendChild(g);
    return wrap;
  }

  function pluma(x, y, giro, s, retraso) {
    const wrap = el('g', { transform: `translate(${x},${y}) rotate(${giro}) scale(${s})` });
    const g = el('g', { class: 'hoja' });
    g.style.setProperty('--d', retraso.toFixed(2) + 's');
    g.appendChild(el('path', { d: 'M0,0 C 14,-4 30,-6 46,-4', stroke: '#5C8A4C',
                               'stroke-width': 1.2, fill: 'none' }));
    for (let i = 0; i < 11; i++) {
      const t = i / 10, px = t * 46, py = -4 * Math.sin(t * 2.2), l = 8 - t * 3.5;
      g.appendChild(el('path', { d: `M${px.toFixed(1)},${py.toFixed(1)} l ${(l*.35).toFixed(1)},${(-l).toFixed(1)}`,
        stroke: '#6E9C58', 'stroke-width': .9, 'stroke-linecap': 'round', fill: 'none', opacity: .85 }));
      g.appendChild(el('path', { d: `M${px.toFixed(1)},${py.toFixed(1)} l ${(l*.3).toFixed(1)},${(l*.85).toFixed(1)}`,
        stroke: '#628E4F', 'stroke-width': .9, 'stroke-linecap': 'round', fill: 'none', opacity: .8 }));
    }
    wrap.appendChild(g);
    return wrap;
  }

  /* ---------- papel: lóbulos redondeados desde el atado ---------- */
  function panel(ang, largo, ancho, relleno, op) {
    const a = ang * Math.PI / 180;
    const ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux, m = .55;
    const px = 150 + ux * largo, py = 262 + uy * largo;
    const d = `M150,262 `
      + `C ${(150+ux*largo*m+nx*ancho).toFixed(1)},${(262+uy*largo*m+ny*ancho).toFixed(1)} `
      +   `${(px+nx*ancho*.5).toFixed(1)},${(py+ny*ancho*.5).toFixed(1)} ${px.toFixed(1)},${py.toFixed(1)} `
      + `C ${(px-nx*ancho*.5).toFixed(1)},${(py-ny*ancho*.5).toFixed(1)} `
      +   `${(150+ux*largo*m-nx*ancho).toFixed(1)},${(262+uy*largo*m-ny*ancho).toFixed(1)} 150,262 Z`;
    return el('path', { d, fill: relleno, opacity: op });
  }
  [[-162,104,34,'url(#papelA)',.8,.12],[-134,116,38,'url(#papelB)',.75,.16],
   [-90,124,40,'url(#papelB)',.7,.2],[-46,116,38,'url(#papelB)',.75,.24],
   [-18,104,34,'url(#papelA)',.8,.28]]
    .forEach(([a,l,w,f,o,d]) => papelAtras.appendChild(pieza(panel(a,l,w,f,o), d)));

  /* verde alrededor */
  [[54,162,-32,.84],[246,158,210,.82],[74,200,-14,.72],[226,196,194,.7],
   [150,76,-92,.58],[98,106,-58,.52],[202,102,238,.52],[122,72,-78,.46],[180,70,256,.46]]
    .forEach(([x,y,g,t], i) => verde.appendChild(hoja(x, y, g, t, 0.32 + i*.06)));
  [[68,192,-24,.86],[232,186,204,.82],[102,216,-8,.74]]
    .forEach(([x,y,g,t], i) => verde.appendChild(pluma(x, y, g, t, 0.5 + i*.09)));

  /* masa oscura detrás del ramo: sin ella los huecos entre flores se ven
     blancos y el ramo parece recortado y vacío */
  verde.appendChild(pieza(el('ellipse', {
    cx: 150, cy: 144, rx: 80, ry: 58, fill: 'url(#hondo)' }), 0.3));

  /* hojas apretadas por detrás: el relleno natural entre flores */
  [[104,150,-14,.5],[196,146,192,.48],[128,120,-34,.44],[172,118,214,.44],
   [150,158,-4,.46],[118,176,-24,.4],[182,172,204,.4]]
    .forEach(([x,y,g,t], i) => verde.appendChild(hoja(x, y, g, t, 0.34 + i*.05)));

  /* capullos hacia afuera */
  [[84,98,-44,.7,1.25],[128,74,-14,.76,1.12],[174,72,12,.76,1.18],
   [218,96,40,.7,1.3],[150,62,0,.64,1.36]]
    .forEach(([x,y,g,s,d]) => capullos.appendChild(capullo(x, y, s, g, d)));

  /* lirios: de atrás hacia delante, solapándose para formar masa */
  [[88,116,.62,-34,1.0],[212,110,.62,32,1.06],[150,92,.66,2,.92],
   [66,168,.52,-46,1.14],[236,164,.52,44,1.2],
   [112,152,.78,-16,.7],[192,148,.74,18,.76],[150,174,.72,4,.64]]
    .forEach(([x,y,s,g,d]) => flores.appendChild(lirio(x, y, s, g, d)));

  /* papel por delante */
  [[-114,52,22,1.55],[-66,52,22,1.62]].forEach(([a,l,w,d]) =>
    papelFrente.appendChild(pieza(panel(a,l,w,'url(#papelA)',.7), d)));

  /* atado y cintas */
  base.appendChild(pieza(el('path', { d: 'M136,256 L164,256 L158,296 L142,296 Z', fill: '#FBEFE6' }), 1.7));
  [['M144,264 C 130,278 112,288 92,288', 1.85], ['M156,264 C 170,280 190,290 210,290', 1.95]]
    .forEach(([d, ret]) => {
      const c = el('path', { d, fill: 'none', stroke: 'url(#cintaG)', 'stroke-width': 2.4,
                             'stroke-linecap': 'round', class: 'cinta' });
      base.appendChild(c);
      c.style.setProperty('--l', c.getTotalLength());
      c.style.setProperty('--d', ret + 's');
    });

  document.getElementById('abrir').addEventListener('click', function () {
    document.getElementById('tarjeta').classList.add('abierta');
    this.blur();
  });
})();
</script>
</body>
</html>
