<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F3">
<title>Para Emil</title>
<style>
  :root{
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    --papel:#FFFDFC;
    --fondo:#FAF6F3;
    --tinta:#2A2522;
    --gris:#867C76;
    --tenue:#AFA49D;
    --rosa:#C58E96;
    --rosa-suave:#FBF0F0;
    --linea:rgba(42,37,34,.10);
    --ease:cubic-bezier(.22,.68,.24,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden}

  body{
    min-height:100svh;
    display:grid;place-items:center;
    padding:calc(env(safe-area-inset-top) + 1.1rem) 1.2rem calc(env(safe-area-inset-bottom) + 1.1rem);
    background:
      radial-gradient(56% 32% at 80% 4%, #FDF1F1 0%, rgba(253,241,241,0) 70%),
      radial-gradient(50% 30% at 12% 94%, #F6F0EC 0%, rgba(246,240,236,0) 72%),
      var(--fondo);
    background-attachment:fixed;
    font-family:var(--sans);color:var(--tinta);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  .tarjeta{
    width:100%;max-width:23.5rem;
    background:var(--papel);border:1px solid var(--linea);border-radius:22px;
    padding:1.6rem 1.6rem 1.7rem;text-align:center;
    box-shadow:0 1px 2px rgba(42,37,34,.04), 0 34px 64px -38px rgba(42,37,34,.4);
    opacity:0;transform:translate3d(0,14px,0);
    animation:entrar 1.1s var(--ease) .1s forwards;
  }
  @keyframes entrar{to{opacity:1;transform:none}}

  .etiqueta{
    font-size:.58rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
    text-indent:.3em;color:var(--tenue);
  }

  /* ---------------- el ramo ---------------- */
  .ramo{
    display:block;width:100%;height:auto;
    margin:.5rem auto .2rem;
    max-width:19rem;
  }
  /* cada flor: el grupo de fuera coloca, el de dentro anima */
  .flor{
    transform-box:fill-box;transform-origin:50% 50%;
    transform:scale(.04);opacity:0;
    animation:florecer 1s cubic-bezier(.18,1.16,.3,1) var(--d) forwards;
  }
  @keyframes florecer{
    0%{transform:scale(.04) rotate(-22deg);opacity:0}
    45%{opacity:1}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  .hoja{
    transform-box:fill-box;transform-origin:0% 50%;
    transform:scale(.06);opacity:0;
    animation:brotar .85s var(--ease) var(--d) forwards;
  }
  @keyframes brotar{to{transform:scale(1);opacity:.95}}
  .pieza{opacity:0;animation:surgir .9s var(--ease) var(--d) forwards}
  @keyframes surgir{to{opacity:1}}
  .cinta{
    stroke-dasharray:var(--l);stroke-dashoffset:var(--l);
    animation:trazar 1.5s var(--ease) var(--d) forwards;
  }
  @keyframes trazar{to{stroke-dashoffset:0}}

  /* ---------------- caras ---------------- */
  .caras{display:grid;margin:.9rem 0 1.1rem}
  .cara{grid-area:1/1;transition:opacity .7s var(--ease), transform .7s var(--ease)}

  .cara--cerrada{display:flex;flex-direction:column;align-items:center;gap:.9rem}
  .abierta .cara--cerrada{opacity:0;transform:translate3d(0,-8px,0);pointer-events:none}

  .susurro{font-family:var(--serif);font-size:.95rem;color:var(--tenue);font-style:italic}

  .pista{
    font-family:var(--sans);
    font-size:.62rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
    color:var(--rosa);background:var(--rosa-suave);
    border:1px solid #F0DDDE;border-radius:999px;
    min-height:44px;padding:.7rem 1.2rem;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .4s var(--ease);
  }
  .pista:active{transform:scale(.96)}
  .pista:focus-visible{outline:2px solid var(--rosa);outline-offset:3px}

  .cara--nota{opacity:0;transform:translate3d(0,12px,0);pointer-events:none}
  .abierta .cara--nota{opacity:1;transform:none;pointer-events:auto}

  .linea{
    font-family:var(--serif);font-weight:400;
    font-size:clamp(1.02rem,4.2vw,1.18rem);
    line-height:1.58;letter-spacing:-.006em;
    opacity:0;transform:translate3d(0,10px,0);
    transition:opacity 1s var(--ease), transform 1s var(--ease);
  }
  .linea + .linea{margin-top:.7rem}
  .l2{color:var(--gris)}
  .abierta .l1{opacity:1;transform:none;transition-delay:.3s}
  .abierta .l2{opacity:1;transform:none;transition-delay:1.05s}
  .abierta .l3{opacity:1;transform:none;transition-delay:1.8s}

  .regla{height:1px;background:var(--linea);transform:scaleX(0);
         transition:transform 1.1s var(--ease) 2.5s}
  .abierta .regla{transform:scaleX(1)}

  .firma{
    margin-top:1.1rem;
    font-size:.6rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;
    text-indent:.28em;color:var(--tenue);
    opacity:0;transition:opacity 1.2s var(--ease) 2.9s;
  }
  .abierta .firma{opacity:1}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;animation-iteration-count:1 !important;
      animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important;
    }
    .tarjeta{opacity:1;transform:none}
    .flor{transform:scale(1);opacity:1}
    .hoja{transform:scale(1);opacity:.95}
    .pieza{opacity:1}
    .cinta{stroke-dashoffset:0}
  }
</style>
</head>
<body>

<article class="tarjeta" id="tarjeta">
  <p class="etiqueta">Para Emil</p>

  <svg class="ramo" viewBox="0 0 300 284" role="img" aria-label="Un ramo de rosas y hortensias en una caja con cintas">
    <defs>
      <linearGradient id="caja" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#F2F6F9"/>
        <stop offset="55%" stop-color="#DFE8EF"/>
        <stop offset="100%" stop-color="#C9D6E1"/>
      </linearGradient>
      <linearGradient id="rimel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FBFDFE"/>
        <stop offset="100%" stop-color="#DDE7EE"/>
      </linearGradient>
      <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#A7C9AF"/>
        <stop offset="100%" stop-color="#5A8467"/>
      </linearGradient>
      <linearGradient id="cintaG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#F6DCDF"/>
        <stop offset="100%" stop-color="#E3B9C0"/>
      </linearGradient>
    </defs>

    <g id="hojas"></g>
    <g id="cajaG"></g>
    <g id="flores"></g>
    <g id="cintas"></g>
  </svg>

  <div class="caras">
    <div class="cara cara--cerrada">
      <p class="susurro">Te traje flores que no se marchitan.</p>
      <button class="pista" id="abrir" type="button">toca para abrir la nota</button>
    </div>

    <div class="cara cara--nota" role="note">
      <p class="linea l1">No esperé una fecha especial: eres tú.</p>
      <p class="linea l2">Este es el último detalle que te mando siendo lo que somos hoy.</p>
      <p class="linea l3">El próximo llega cuando seas mi novio.</p>
    </div>
  </div>

  <div class="regla" aria-hidden="true"></div>
  <p class="firma">— Tom</p>
</article>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, a) => { const n = document.createElementNS(NS, t); for (const k in (a||{})) if (a[k]!=null) n.setAttribute(k, a[k]); return n; };
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* paletas de las fotos: rosa fuerte, blush, crema, durazno y un lila suave */
  const PALETAS = [
    { fuera:'#D9738C', dentro:'#F0A6B8', claro:'#FCDCE4', ojo:'#C25E79' },
    { fuera:'#E9A0B2', dentro:'#F8C8D5', claro:'#FFEDF1', ojo:'#D9899C' },
    { fuera:'#E8CDA6', dentro:'#F7E6CE', claro:'#FFF9F0', ojo:'#D9B98C' },
    { fuera:'#E5A47E', dentro:'#F6CDB2', claro:'#FEEBDD', ojo:'#D18C63' },
    { fuera:'#D592AF', dentro:'#EFBFD2', claro:'#FBE6EF', ojo:'#C077A0' },
    { fuera:'#EADCC8', dentro:'#F8EFE3', claro:'#FFFCF8', ojo:'#DCC9AF' },
  ];
  const AZULES = ['#A9BDE8', '#BCCBEE', '#93A9DC'];

  const hojas  = document.querySelector('#hojas');
  const cajaG  = document.querySelector('#cajaG');
  const flores = document.querySelector('#flores');
  const cintas = document.querySelector('#cintas');

  /* --- rosa de jardín: masa de fondo y cuatro coronas que se solapan ---
     la masa evita que se vean huecos entre pétalos, que es lo que hacía
     que pareciera una margarita en vez de una rosa --- */
  const defs = document.querySelector('defs');
  PALETAS.forEach((pal, i) => {
    const g = el('radialGradient', { id: 'pet' + i, cx: '40%', cy: '32%' });
    g.appendChild(el('stop', { offset: '0%',   'stop-color': pal.claro }));
    g.appendChild(el('stop', { offset: '58%',  'stop-color': pal.dentro }));
    g.appendChild(el('stop', { offset: '100%', 'stop-color': pal.fuera }));
    defs.appendChild(g);
  });

  function rosa(x, y, R, idx, retraso) {
    const pal = PALETAS[idx];
    const wrap = el('g', { transform: `translate(${x},${y}) rotate(${rnd(0,72).toFixed(0)})` });
    const g = el('g', { class: 'flor' });
    g.style.setProperty('--d', retraso.toFixed(2) + 's');

    // masa: el cuerpo de la flor, para que no se transparente el fondo
    g.appendChild(el('circle', { r: (R * .92).toFixed(2), fill: pal.fuera }));

    [ { n:9, r:R*.66, rx:R*.40, ry:R*.50, giro:0   },
      { n:7, r:R*.46, rx:R*.34, ry:R*.43, giro:26  },
      { n:5, r:R*.27, rx:R*.27, ry:R*.34, giro:52  },
      { n:3, r:R*.11, rx:R*.19, ry:R*.24, giro:12  } ].forEach((c) => {
      for (let k = 0; k < c.n; k++) {
        const a = (k / c.n) * Math.PI * 2 + c.giro * Math.PI / 180;
        const px = Math.cos(a) * c.r, py = Math.sin(a) * c.r;
        g.appendChild(el('ellipse', {
          cx: px.toFixed(2), cy: py.toFixed(2),
          rx: c.rx.toFixed(2), ry: c.ry.toFixed(2),
          fill: `url(#pet${idx})`,
          transform: `rotate(${(a * 180 / Math.PI + 90).toFixed(1)} ${px.toFixed(2)} ${py.toFixed(2)})`,
        }));
      }
    });
    g.appendChild(el('circle', { r: (R*.11).toFixed(2), fill: pal.ojo, opacity: .8 }));
    wrap.appendChild(g);
    return wrap;
  }

  /* --- hortensia: ramillete de flores de cuatro pétalos --- */
  function hortensia(x, y, R, retraso) {
    const wrap = el('g', { transform: `translate(${x},${y})` });
    const g = el('g', { class: 'flor' });
    g.style.setProperty('--d', retraso.toFixed(2) + 's');
    for (let i = 0; i < 6; i++) {
      const a = i * 1.05, r = R * .55 * Math.sqrt((i + .4) / 6);
      const fx = Math.cos(a) * r, fy = Math.sin(a) * r * .85;
      const col = AZULES[i % AZULES.length];
      for (let k = 0; k < 4; k++) {
        g.appendChild(el('ellipse', {
          cx: fx.toFixed(2), cy: fy.toFixed(2),
          rx: (R*.14).toFixed(2), ry: (R*.2).toFixed(2), fill: col,
          transform: `rotate(${k*90+20} ${fx.toFixed(2)} ${fy.toFixed(2)}) translate(0 ${(-R*.17).toFixed(2)})`,
        }));
      }
      g.appendChild(el('circle', { cx: fx.toFixed(2), cy: fy.toFixed(2), r: (R*.05).toFixed(2), fill: '#F3F6DE' }));
    }
    wrap.appendChild(g);
    return wrap;
  }

  function hoja(x, y, giro, tam, retraso) {
    const wrap = el('g', { transform: `translate(${x},${y}) rotate(${giro}) scale(${tam})` });
    const g = el('g', { class: 'hoja' });
    g.style.setProperty('--d', retraso.toFixed(2) + 's');
    g.appendChild(el('path', { d: 'M0,0 C 11,-11 32,-13 48,-2 C 32,9 11,11 0,0 Z', fill: 'url(#verde)' }));
    wrap.appendChild(g);
    return wrap;
  }

  /* --- la caja --- */
  function pieza(nodo, retraso) {
    nodo.setAttribute('class', 'pieza');
    nodo.style.setProperty('--d', retraso + 's');
    return nodo;
  }
  cajaG.appendChild(pieza(el('path', {
    d: 'M88,200 L212,200 L203,268 Q202,275 195,275 L105,275 Q98,275 97,268 Z',
    fill: 'url(#caja)',
  }), 0.15));
  cajaG.appendChild(pieza(el('ellipse', { cx: 150, cy: 200, rx: 62, ry: 11, fill: 'url(#rimel)' }), 0.2));

  /* hojas asomando por detrás */
  [[68,180,-26,.68],[232,178,198,.66],[86,202,-6,.56],[214,200,190,.56],[150,90,-96,.46],[104,120,-52,.42],[196,118,224,.42]]
    .forEach(([x,y,g,t], i) => hojas.appendChild(hoja(x, y, g, t, 0.3 + i*.09)));

  /* --- la cúpula de flores: del centro hacia afuera --- */
  const CX = 150, CY = 144, RX = 84, RY = 60;
  const PHI = Math.PI * (3 - Math.sqrt(5));
  const puestos = [];
  for (let i = 0; i < 30; i++) {
    const q = Math.sqrt((i + .5) / 30);
    const a = i * PHI;
    puestos.push({
      x: CX + Math.cos(a) * RX * q,
      y: CY + Math.sin(a) * RY * q - q * 8,   // ligera cúpula
      q, i,
    });
  }
  // de atrás hacia delante, para que las de arriba queden encima
  puestos.sort((p, q) => p.y - q.y).forEach((p) => {
    const R = 24 - p.q * 5 + rnd(-1.2, 1.2);
    const retraso = 0.55 + p.q * .8 + rnd(0, .16);
    if (p.i % 8 === 3) flores.appendChild(hortensia(p.x, p.y, R * 1.1, retraso));
    else flores.appendChild(rosa(p.x, p.y, R, p.i % PALETAS.length, retraso));
  });

  /* --- cintas que caen de la caja --- */
  [['M128,220 C 112,246 88,256 62,252', 1.8], ['M172,220 C 190,248 216,260 242,254', 1.95]]
    .forEach(([d, ret]) => {
      const c = el('path', { d, fill: 'none', stroke: 'url(#cintaG)', 'stroke-width': 5,
                             'stroke-linecap': 'round', class: 'cinta' });
      cintas.appendChild(c);
      c.style.setProperty('--l', c.getTotalLength());
      c.style.setProperty('--d', ret + 's');
    });

  document.getElementById('abrir').addEventListener('click', function () {
    document.getElementById('tarjeta').classList.add('abierta');
    this.blur();
  });
})();
</script>
</body>
</html>
