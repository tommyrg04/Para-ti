<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayer</title>
<style>
  :root{
    --tinta:#3A2418;
    --papel:#FBF3E8;
    --sol:#E0A05C;
    --rosa:#C97B72;
    --tenue:rgba(58,36,24,.52);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--papel);
    color:var(--tinta);
    font-family:Georgia,"Times New Roman",serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100svh;
    padding:2rem 1.6rem calc(2rem + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }

  /* La luz. Se mueve muy despacio: el dia avanzando, nada mas. */
  .cielo{
    position:fixed;inset:-20%;z-index:0;
    background:
      radial-gradient(60% 42% at 22% 18%, rgba(224,160,92,.50) 0%, rgba(224,160,92,0) 62%),
      radial-gradient(64% 48% at 82% 76%, rgba(201,123,114,.42) 0%, rgba(201,123,114,0) 66%),
      radial-gradient(90% 70% at 50% 50%, rgba(251,243,232,0) 40%, rgba(233,214,192,.55) 100%);
    will-change:transform;
    animation:derivar 26s ease-in-out infinite alternate;
  }
  @keyframes derivar{
    from{transform:translate3d(-2.2%,-1.4%,0) scale(1.04)}
    to  {transform:translate3d(2.6%,1.8%,0) scale(1.10)}
  }

    background-size:52px;
    opacity:.05;mix-blend-mode:multiply;
  }

  main{position:relative;z-index:2;width:100%;max-width:30rem;text-align:center}

  .beat{
    position:absolute;left:0;right:0;top:50%;
    transform:translateY(-50%);
    opacity:0;visibility:hidden;
    transition:opacity .9s ease, visibility .9s;
  }
  .beat.activo{opacity:1;visibility:visible}

  .linea{
    font-size:clamp(1.55rem,6.4vw,2.35rem);
    line-height:1.42;
    letter-spacing:.005em;
    opacity:0;transform:translateY(.6rem);
  }
  .activo .linea{animation:entrar 1.1s cubic-bezier(.22,.7,.3,1) forwards}
  .activo .linea:nth-child(2){animation-delay:.85s}
  .activo .linea:nth-child(3){animation-delay:1.7s}
  @keyframes entrar{to{opacity:1;transform:none}}

  .suave{color:var(--tenue);font-style:italic}

  /* portada */
  .beat.portada .grande{
    display:block;
    font-size:clamp(3.6rem,19vw,6.4rem);
    line-height:1;letter-spacing:-.02em;
  }
  .beat.portada .bajo{
    display:block;margin-top:1.1rem;
    font-size:clamp(1rem,4.2vw,1.2rem);color:var(--tenue);
  }

  /* cierre */
  .beat.final .firma{
    display:block;margin-top:2.6rem;
    font-size:clamp(.95rem,3.8vw,1.05rem);
    letter-spacing:.22em;color:var(--tenue);
  }

  .pista{
    position:fixed;left:0;right:0;z-index:3;
    bottom:calc(1.9rem + env(safe-area-inset-bottom));
    text-align:center;font-size:.82rem;letter-spacing:.2em;
    color:var(--tenue);font-style:italic;
    transition:opacity .7s ease;
  }
  .pista.oculta{opacity:0}

  /* boton de sonido: tiene que verse, porque si el iPhone esta en
     silencio la musica no suena y hay que poder enterarse */
  .sonido{
    position:fixed;z-index:4;
    top:calc(1.2rem + env(safe-area-inset-top));
    right:calc(1.2rem + env(safe-area-inset-right));
    width:2.9rem;height:2.9rem;border-radius:50%;
    border:1px solid rgba(58,36,24,.22);
    background:rgba(251,243,232,.72);
    display:none;align-items:center;justify-content:center;
    cursor:pointer;color:var(--tinta);
    transition:opacity .4s ease;
  }
  .sonido.visible{display:flex}
  .sonido svg{width:1.15rem;height:1.15rem;display:block}
  .sonido .tachado{display:none}
  .sonido.callado .onda{display:none}
  .sonido.callado .tachado{display:block}
  .sonido .aviso{
    position:absolute;right:calc(100% + .55rem);top:50%;
    transform:translateY(-50%);
    white-space:nowrap;font-family:Georgia,serif;font-style:italic;
    font-size:.78rem;color:var(--tenue);
    transition:opacity .6s ease;
  }
  .sonido .aviso.ido{opacity:0}

  @media (prefers-reduced-motion: reduce){
    .cielo{animation:none}
    .beat{transition-duration:.01ms}
    .activo .linea{animation-duration:.01ms;animation-delay:0s}
  }
</style>
</head>
<body>

<div class="cielo"></div>
<div class="grano"></div>

<main>
  <section class="beat portada activo">
    <span class="grande">Ayer</span>
    <span class="bajo">por fin</span>
  </section>

  <section class="beat">
    <p class="linea">Te vi por primera vez</p>
    <p class="linea suave">y no me pareció la primera.</p>
  </section>

  <section class="beat">
    <p class="linea">Hicimos cosas normales.</p>
    <p class="linea suave">Ninguna lo fue.</p>
  </section>

  <section class="beat">
    <p class="linea">Se me fue el día entero</p>
    <p class="linea suave">y no me di cuenta.</p>
  </section>

  <section class="beat">
    <p class="linea">No era el plan.</p>
    <p class="linea suave">Eras tú.</p>
  </section>

  <section class="beat final">
    <p class="linea">Ya no tengo que imaginarme nada.</p>
    <span class="firma">— TOM</span>
  </section>
</main>

<div class="pista" id="pista">toca para continuar</div>

<button class="sonido" id="sonido" aria-label="Silenciar la música">
  <span class="aviso" id="aviso">si no la oyes, quita el silencio del teléfono</span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="currentColor" stroke="none"/>
    <g class="onda"><path d="M15.4 9.3a3.6 3.6 0 0 1 0 5.4"/><path d="M17.9 6.8a7 7 0 0 1 0 10.4"/></g>
    <path class="tachado" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<audio id="musica" src="carino.mp3" loop preload="auto"></audio>

<script>
(function(){
  var beats = Array.prototype.slice.call(document.querySelectorAll('.beat'));
  var pista = document.getElementById('pista');
  var boton = document.getElementById('sonido');
  var aviso = document.getElementById('aviso');
  var musica = document.getElementById('musica');
  var i = 0, bloqueado = false, sonando = false, hayMusica = true;

  /* Si el mp3 no está, la página tiene que seguir funcionando igual:
     se esconde el botón y no se intenta reproducir nada. */
  musica.addEventListener('error', function(){ hayMusica = false; boton.classList.remove('visible'); });

  function subirVolumen(){
    var t0 = null, dur = 2600;
    musica.volume = 0;
    function paso(t){
      if (!t0) t0 = t;
      var p = Math.min((t - t0) / dur, 1);
      musica.volume = 0.55 * p * p;
      if (p < 1) requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  }

  function encender(){
    if (!hayMusica || sonando) return;
    var intento = musica.play();
    if (intento && intento.catch) intento.catch(function(){ /* el navegador dijo que no */ });
    sonando = true;
    boton.classList.add('visible');
    setTimeout(function(){ aviso.classList.add('ido'); }, 5200);
    subirVolumen();
  }

  function mostrar(n){
    beats.forEach(function(b){ b.classList.remove('activo'); });
    beats[n].classList.add('activo');
    if (n === beats.length - 1) pista.classList.add('oculta');
  }

  function avanzar(){
    encender();
    if (bloqueado || i >= beats.length - 1) return;
    bloqueado = true;
    i++;
    mostrar(i);
    setTimeout(function(){ bloqueado = false; }, 900);
  }

  boton.addEventListener('click', function(e){
    e.stopPropagation();
    musica.muted = !musica.muted;
    boton.classList.toggle('callado', musica.muted);
    boton.setAttribute('aria-label', musica.muted ? 'Poner la música' : 'Silenciar la música');
  });

  mostrar(0);
  document.addEventListener('click', avanzar);
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight'){ e.preventDefault(); avanzar(); }
  });
})();
</script>
</body>
</html>
