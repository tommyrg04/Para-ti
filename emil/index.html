<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Emil</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100svh;
    background:radial-gradient(95% 68% at 50% 94%, #10303f 0%, #08192a 45%, #020610 100%);
    overflow:hidden;
    font-family:ui-serif, Georgia, "Times New Roman", serif;
  }
  .escena{position:relative;height:100svh;width:100%;overflow:hidden}
  .escena, svg.jardin{padding-bottom:env(safe-area-inset-bottom)}

  .estrella{position:absolute;border-radius:50%;background:#fff;will-change:transform,opacity;animation:titilar 5s ease-in-out infinite}
  @keyframes titilar{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.85;transform:scale(1.25)}}

  .luz{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:#e2f2ff;box-shadow:0 0 10px 3px rgba(190,225,255,.5);
    opacity:0;will-change:transform,opacity;animation:flotar 13s ease-in-out infinite;
  }
  @keyframes flotar{
    0%{opacity:0;transform:translate(0,0)}
    15%{opacity:.8}70%{opacity:.35}
    100%{opacity:0;transform:translate(55px,-190px)}
  }

  svg.jardin{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}

  .trazo{
    fill:none;stroke-linecap:round;
    stroke-dasharray:var(--l);stroke-dashoffset:var(--l);
    animation:dibujar 2.4s cubic-bezier(.22,.68,.24,1) forwards;
  }
  @keyframes dibujar{to{stroke-dashoffset:0}}

  .hoja{
    transform-box:fill-box;transform-origin:0% 50%;
    transform:scale(0);opacity:0;
    animation:desplegarHoja 1.2s cubic-bezier(.2,.9,.25,1) forwards;
  }
  @keyframes desplegarHoja{
    0%{transform:scale(.05) rotate(-16deg);opacity:0}
    60%{opacity:.95}
    100%{transform:scale(1) rotate(0);opacity:.95}
  }

  .planta{transform-box:view-box;will-change:transform;animation:mecer 8s ease-in-out infinite}
  @keyframes mecer{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}

  /* pétalo de lirio: se abre y luego se recurva hacia atrás */
  .petalo{
    transform-box:fill-box;transform-origin:50% 100%;
    transform:rotate(calc(var(--a) * .25)) scale(.05);opacity:0;
    animation:abrirLirio 2.1s cubic-bezier(.16,.85,.24,1) forwards;
    animation-delay:var(--d);
  }
  @keyframes abrirLirio{
    0%{transform:rotate(calc(var(--a) * .25)) scale(.05) skewX(0deg);opacity:0}
    20%{opacity:1}
    55%{transform:rotate(calc(var(--a) * .95)) scale(.85) skewX(2deg)}
    100%{transform:rotate(var(--a)) scale(1) skewX(0deg);opacity:1}
  }

  .florcita{
    transform-box:fill-box;transform-origin:50% 50%;
    transform:scale(.05) rotate(-35deg);opacity:0;
    animation:abrirFlorcita 1.3s cubic-bezier(.2,1.3,.35,1) forwards;
    animation-delay:var(--d);
  }
  @keyframes abrirFlorcita{
    0%{transform:scale(.05) rotate(-35deg);opacity:0}
    100%{transform:scale(1) rotate(0);opacity:1}
  }

  .volumen{opacity:0;animation:aparecer 1.6s ease-out forwards;animation-delay:var(--d)}

  .corazon{
    transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);
    animation:abrirCorazon 1.1s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:var(--d);
  }
  @keyframes abrirCorazon{to{transform:scale(1)}}

  .polen{
    transform-box:fill-box;transform-origin:50% 100%;opacity:0;
    animation:salirPolen 1.1s cubic-bezier(.2,.9,.3,1.1) forwards;animation-delay:var(--d);
  }
  @keyframes salirPolen{
    from{opacity:0;transform:rotate(var(--a)) scale(.15)}
    to{opacity:.95;transform:rotate(var(--a)) scale(1)}
  }

  .aura{
    transform-box:fill-box;transform-origin:50% 50%;opacity:0;
    will-change:transform,opacity;
    animation:respirar 6s ease-in-out infinite;animation-delay:var(--d);
  }
  @keyframes respirar{
    0%,100%{opacity:.14;transform:scale(.9)}
    50%{opacity:.36;transform:scale(1.14)}
  }

  /* chispas que suben de las flores */
  .chispa{
    will-change:transform,opacity;
    animation:subirChispa 4.5s ease-out infinite;
    animation-delay:var(--d);
    opacity:0;
  }
  @keyframes subirChispa{
    0%{opacity:0;transform:translateY(0) scale(.4)}
    12%{opacity:.95}
    75%{opacity:.5}
    100%{opacity:0;transform:translateY(-95px) scale(.15)}
  }

  /* "te quiero": mismo tamaño y estilo que el resto del texto */
  .tequiero{
    margin-top:1.4rem;
    font-size:clamp(1rem,3.7vw,1.6rem);
    line-height:1.6;
    font-style:italic;
    color:#eef8ff;
    text-shadow:0 0 30px rgba(150,205,255,.35);
    opacity:0;
    transform:translateY(18px);
    animation:emerger 2.6s cubic-bezier(.16,.7,.2,1) 5.6s forwards;
  }
  @keyframes emerger{
    0%{opacity:0;transform:translateY(18px)}
    100%{opacity:1;transform:translateY(0)}
  }

  .mensaje{
    position:absolute;
    left:env(safe-area-inset-left);right:env(safe-area-inset-right);
    top:calc(3.5vh + env(safe-area-inset-top));
    text-align:center;padding:0 8vw;color:#eef8ff;
    z-index:2;
  }
  .mensaje p{
    font-size:clamp(1rem,3.7vw,1.6rem);
    line-height:1.6;font-style:italic;opacity:0;
    text-shadow:0 0 30px rgba(150,205,255,.35);
    animation:aparecer 3s ease-out 3.6s forwards;
  }
  .firma{
    margin-top:1.6rem;
    font-size:clamp(.85rem,2.9vw,1.05rem);
    color:#a6c8dd;letter-spacing:.08em;opacity:0;
    animation:aparecer 2.4s ease-out 7.6s forwards;
  }
  .firma span{display:block;margin-top:.35rem}
  @keyframes aparecer{to{opacity:1}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
    .trazo{stroke-dashoffset:0}
    .petalo{transform:rotate(var(--a));opacity:1}
    .florcita{transform:scale(1);opacity:1}
    .hoja{transform:scale(1);opacity:.95}
    .corazon{transform:scale(1)}
    .mensaje p,.firma,.volumen{opacity:1}
    .tequiero{opacity:1;transform:none;filter:none}
  }
</style>
</head>
<body>
<div class="escena">

  <div class="mensaje">
    <p>Hay cariños que florecen despacio, pero cuando lo hacen, llenan de luz hasta los rincones más oscuros.</p>
    <div class="tequiero">te quiero</div>
    <div class="firma">
      Para: Emil
      <span>De: T</span>
    </div>
  </div>

  <svg class="jardin" viewBox="0 0 400 560" preserveAspectRatio="xMidYMax slice" aria-label="Lirios y hortensias en la noche">
    <defs>
      <!-- lirio blanco -->
      <linearGradient id="lirioBlanco" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"  stop-color="#cfe9b8"/>
        <stop offset="14%" stop-color="#f0f8e6"/>
        <stop offset="55%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f1fbff"/>
      </linearGradient>
      <linearGradient id="lirioBlancoFondo" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#9dbf9a"/>
        <stop offset="60%" stop-color="#dbe9e4"/>
        <stop offset="100%" stop-color="#eef7f6"/>
      </linearGradient>
      <!-- lirio azul -->
      <linearGradient id="lirioAzul" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"  stop-color="#1b47a8"/>
        <stop offset="20%" stop-color="#3f7ede"/>
        <stop offset="62%" stop-color="#9ac8ff"/>
        <stop offset="100%" stop-color="#eaf5ff"/>
      </linearGradient>
      <linearGradient id="lirioAzulFondo" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#12327c"/>
        <stop offset="70%" stop-color="#5d94dc"/>
        <stop offset="100%" stop-color="#c6def8"/>
      </linearGradient>
      <!-- sombra lateral del pétalo -->
      <linearGradient id="sombraPetalo" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1d3a5c" stop-opacity=".38"/>
        <stop offset="45%" stop-color="#1d3a5c" stop-opacity="0"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity=".22"/>
      </linearGradient>

      <linearGradient id="gTallo" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#0c3f34"/>
        <stop offset="100%" stop-color="#2f9d84"/>
      </linearGradient>
      <linearGradient id="gHoja" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2e9b80"/>
        <stop offset="100%" stop-color="#0d4136"/>
      </linearGradient>
      <radialGradient id="gCentro">
        <stop offset="0%" stop-color="#fffdf0"/>
        <stop offset="55%" stop-color="#f2dd8e"/>
        <stop offset="100%" stop-color="#c9a94f"/>
      </radialGradient>
      <radialGradient id="auraBlanca">
        <stop offset="0%" stop-color="#dbfff7" stop-opacity=".8"/>
        <stop offset="100%" stop-color="#dbfff7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="auraAzul">
        <stop offset="0%" stop-color="#8ec4ff" stop-opacity=".8"/>
        <stop offset="100%" stop-color="#8ec4ff" stop-opacity="0"/>
      </radialGradient>
      <!-- volumen de la hortensia -->
      <radialGradient id="domoLuz" cx="34%" cy="28%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".45"/>
        <stop offset="55%" stop-color="#ffffff" stop-opacity=".06"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="domoSombra" cx="50%" cy="50%">
        <stop offset="55%" stop-color="#0a1f3d" stop-opacity="0"/>
        <stop offset="100%" stop-color="#07142b" stop-opacity=".5"/>
      </radialGradient>

      <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="4.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowSuave" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="1.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <g id="hierba"></g>
    <g id="plantas"></g>
    <g id="chispas"></g>
  </svg>
</div>

<script>
const escena = document.querySelector('.escena');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
const rnd = (a, b) => a + Math.random() * (b - a);
const SUELO = 560;

/* estrellas y luciérnagas */
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div'); s.className = 'estrella';
  const t = rnd(1, 2.4);
  s.style.cssText = `left:${rnd(0,100)}%;top:${rnd(0,72)}%;width:${t}px;height:${t}px;animation-delay:${rnd(0,5).toFixed(2)}s`;
  escena.appendChild(s);
}
for (let i = 0; i < 16; i++) {
  const l = document.createElement('div'); l.className = 'luz';
  l.style.cssText = `left:${rnd(2,98)}%;top:${rnd(45,88)}%;animation-delay:${rnd(0,13).toFixed(2)}s`;
  escena.appendChild(l);
}

/* hierba */
const hierba = document.querySelector('#hierba');
for (let i = 0; i < 90; i++) {
  const x = rnd(-10, 410), h = rnd(35, 180), c = rnd(-32, 32);
  const p = el('path', {
    d: `M${x},${SUELO} C ${x + c * .3},${SUELO - h * .5} ${x + c * .8},${SUELO - h * .8} ${x + c},${SUELO - h}`,
    stroke: 'url(#gTallo)', 'stroke-width': rnd(1.2, 2.6).toFixed(1),
    opacity: rnd(.2, .68).toFixed(2), class: 'trazo'
  });
  p.style.setProperty('--l', h + 40);
  p.style.animationDelay = rnd(0, 1).toFixed(2) + 's';
  p.style.animationDuration = rnd(1.4, 2.2).toFixed(2) + 's';
  hierba.appendChild(p);
}

/* ---------------- LIRIO ---------------- */
/* tépalo estrecho, de punta afilada y borde ondulado, como el del lirio real */
const D_TEPALO_INT = 'M0,0 C 7,-10 12,-22 11,-36 C 10,-48 5,-58 0,-68 C -5,-58 -10,-48 -11,-36 C -12,-22 -7,-10 0,0 Z';
const D_TEPALO_EXT = 'M0,0 C 6,-10 10,-22 9,-38 C 8,-50 4,-60 0,-70 C -4,-60 -8,-50 -9,-38 C -10,-22 -6,-10 0,0 Z';

function tepalo(d, fill, azul, conPecas) {
  const g = el('g', { class: 'petalo' });
  g.appendChild(el('path', { d, fill }));
  g.appendChild(el('path', { d, fill: 'url(#sombraPetalo)' }));
  // nervadura central
  g.appendChild(el('path', {
    d: 'M0,-4 C 1.5,-20 1.5,-42 0,-62',
    stroke: azul ? '#dcecff' : '#e7f3e2', 'stroke-width': .9, fill: 'none', opacity: .55
  }));
  // pecas cerca de la garganta, como los lirios
  if (conPecas) {
    const pecas = [[2.5,-12],[-3,-16],[4,-20],[-1.5,-24],[3,-28],[-4,-30],[1,-34]];
    pecas.forEach(([x, y]) => g.appendChild(el('ellipse', {
      cx: x, cy: y, rx: 1.1, ry: 1.7, fill: azul ? '#123a7e' : '#c98a63', opacity: .55
    })));
  }
  return g;
}

function lirio(cx, cy, s, retraso, azul) {
  const g = el('g', { transform: `translate(${cx},${cy}) scale(${s})` });

  const aura = el('circle', { r: 78, fill: azul ? 'url(#auraAzul)' : 'url(#auraBlanca)', class: 'aura' });
  aura.style.setProperty('--d', retraso + 's');
  g.appendChild(aura);

  // 3 tépalos externos (sépalos), más estrechos y por detrás
  const atras = el('g', { filter: 'url(#glowSuave)', opacity: .92 });
  for (let i = 0; i < 3; i++) {
    const a = i * 120 + 60;
    const p = tepalo(D_TEPALO_EXT, azul ? 'url(#lirioAzulFondo)' : 'url(#lirioBlancoFondo)', azul, false);
    p.style.setProperty('--a', a + 'deg');
    p.style.setProperty('--d', (retraso + i * .1) + 's');
    atras.appendChild(p);
  }
  g.appendChild(atras);

  // 3 tépalos internos, anchos y con pecas
  const frente = el('g', { filter: 'url(#glow)' });
  for (let i = 0; i < 3; i++) {
    const a = i * 120;
    const p = tepalo(D_TEPALO_INT, azul ? 'url(#lirioAzul)' : 'url(#lirioBlanco)', azul, true);
    p.style.setProperty('--a', a + 'deg');
    p.style.setProperty('--d', (retraso + .35 + i * .11) + 's');
    frente.appendChild(p);
  }
  g.appendChild(frente);

  // 6 estambres largos y curvos + anteras alargadas
  const est = el('g');
  for (let i = 0; i < 6; i++) {
    const a = i * 60 + 30;
    const t = el('g', { class: 'polen' });
    t.style.setProperty('--a', a + 'deg');
    t.style.setProperty('--d', (retraso + 1.25 + i * .05) + 's');
    t.appendChild(el('path', {
      d: 'M0,0 C 2,-12 5,-22 9,-30', stroke: azul ? '#dcecff' : '#f3eddc',
      'stroke-width': 1, fill: 'none', opacity: .9
    }));
    t.appendChild(el('ellipse', {
      cx: 10, cy: -32, rx: 1.7, ry: 4.2, fill: '#d9a441',
      transform: 'rotate(34 10 -32)', filter: 'url(#glowSuave)'
    }));
    est.appendChild(t);
  }
  g.appendChild(est);

  // pistilo
  const pist = el('g', { class: 'polen' });
  pist.style.setProperty('--a', '0deg');
  pist.style.setProperty('--d', (retraso + 1.35) + 's');
  pist.appendChild(el('path', { d: 'M0,0 C -1,-14 -2,-28 -2,-38', stroke: '#eaf6ee', 'stroke-width': 1.4, fill: 'none' }));
  pist.appendChild(el('ellipse', { cx: -2, cy: -39, rx: 2.6, ry: 2, fill: '#fff2c2' }));
  g.appendChild(pist);

  // garganta
  const c = el('circle', { r: 6, fill: 'url(#gCentro)', class: 'corazon', filter: 'url(#glow)' });
  c.style.setProperty('--d', (retraso + 1.1) + 's');
  g.appendChild(c);
  return g;
}

/* ---------------- HORTENSIA ---------------- */
/* sépalo ancho y ovalado: la hortensia no tiene pétalos finos, tiene 4 sépalos que se solapan */
const D_SEPALO = 'M0,-1 C 5,-2 9.5,-6 10,-12.5 C 10.4,-18 5.5,-22 0,-22 C -5.5,-22 -10.4,-18 -10,-12.5 C -9.5,-6 -5,-2 0,-1 Z';

function florcita(x, y, tam, giro, colorA, colorB, retraso, idx) {
  const g = el('g', { transform: `translate(${x},${y}) scale(${tam}) rotate(${giro})`, class: 'florcita' });
  g.style.setProperty('--d', retraso + 's');
  const grad = 'sep' + idx;
  const lg = el('linearGradient', { id: grad, x1: '0', y1: '1', x2: '0', y2: '0' });
  lg.appendChild(el('stop', { offset: '0%', 'stop-color': colorA }));
  lg.appendChild(el('stop', { offset: '100%', 'stop-color': colorB }));
  g.appendChild(lg);
  for (let i = 0; i < 4; i++) {
    const rot = i * 90 + rnd(-6, 6);
    const s = el('path', {
      d: D_SEPALO, fill: `url(#${grad})`, transform: `rotate(${rot})`,
      stroke: '#33508f', 'stroke-width': .35, 'stroke-opacity': .45
    });
    g.appendChild(s);
    g.appendChild(el('path', {
      d: 'M0,-3 C .5,-9 .5,-15 0,-20', transform: `rotate(${rot})`,
      stroke: '#ffffff', 'stroke-width': .5, 'stroke-opacity': .3, fill: 'none'
    }));
  }
  g.appendChild(el('circle', { r: 1.8, fill: '#e9f0c9', opacity: .85 }));
  g.appendChild(el('circle', { r: .7, fill: '#8fa64a', opacity: .8 }));
  return g;
}

const PALETA = [
  ['#3c63c9', '#8fb8ff'], ['#4a70d6', '#a6c6ff'], ['#5a63c4', '#b3b6ff'],
  ['#3f7ad2', '#9fd0ff'], ['#6a63bd', '#c0b7f5'], ['#3559b8', '#87aef7']
];

function hortensia(cx, cy, s, retraso) {
  const g = el('g', { transform: `translate(${cx},${cy}) scale(${s})` });

  const aura = el('circle', { r: 60, fill: 'url(#auraAzul)', class: 'aura' });
  aura.style.setProperty('--d', retraso + 's');
  g.appendChild(aura);

  // capa de fondo, más oscura: da profundidad al ramillete
  const capas = [
    { n: 22, r: 40, esc: .78, op: .55, sombra: true, retra: 0 },
    { n: 30, r: 34, esc: .95, op: 1, sombra: false, retra: .25 },
    { n: 16, r: 20, esc: 1.08, op: 1, sombra: false, retra: .5 }
  ];
  const phi = Math.PI * (3 - Math.sqrt(5));
  let idx = 0;
  capas.forEach((capa, ci) => {
    const cg = el('g', { opacity: capa.op, filter: ci === 0 ? 'url(#glowSuave)' : null });
    for (let i = 0; i < capa.n; i++) {
      const r = capa.r * Math.sqrt((i + .5) / capa.n);
      const a = (idx) * phi;
      const x = Math.cos(a) * r, y = Math.sin(a) * r * .78 - ci * 3;
      const pal = PALETA[idx % PALETA.length];
      const colA = capa.sombra ? '#1e3a86' : pal[0];
      const colB = capa.sombra ? '#4d6cb8' : pal[1];
      cg.appendChild(florcita(x, y, capa.esc * rnd(.88, 1.08), rnd(0, 90), colA, colB,
        retraso + capa.retra + (r / capa.r) * .7 + rnd(0, .2), idx));
      idx++;
    }
    g.appendChild(cg);
  });

  // volumen: luz arriba-izquierda y sombra en el borde
  const vol = el('g', { class: 'volumen' });
  vol.style.setProperty('--d', (retraso + 1.2) + 's');
  vol.appendChild(el('ellipse', { rx: 46, ry: 38, fill: 'url(#domoSombra)' }));
  vol.appendChild(el('ellipse', { rx: 44, ry: 36, fill: 'url(#domoLuz)' }));
  g.appendChild(vol);
  return g;
}

/* hoja: dentada para la hortensia, lisa y lanceolada para el lirio */
function hoja(x, y, rot, tam, retraso, dentada) {
  const g = el('g', { transform: `translate(${x},${y}) rotate(${rot}) scale(${tam})`, class: 'hoja' });
  g.style.animationDelay = retraso + 's';
  const d = dentada
    ? 'M0,0 C 10,-13 22,-19 32,-16 C 30,-11 36,-13 40,-9 C 37,-6 43,-7 46,-3 C 40,8 20,14 0,0 Z'
    : 'M0,0 C 12,-12 38,-15 56,-2 C 38,11 12,13 0,0 Z';
  g.appendChild(el('path', { d, fill: 'url(#gHoja)' }));
  g.appendChild(el('path', { d: 'M2,0 C 18,-2 36,-3 50,-3', stroke: '#68d3b4', 'stroke-width': .8, fill: 'none', opacity: .45 }));
  return g;
}

/* ---------------- jardín ---------------- */
const plantas = document.querySelector('#plantas');
const chispas = document.querySelector('#chispas');

const DISENO = [
  { tipo: 'hortensia', bx: 52,  by: SUELO, fx: 46,  fy: 392, s: .92, d: 3.1, cur: [70, 505, 36, 448], grosor: 4.6 },
  { tipo: 'hortensia', bx: 350, by: SUELO, fx: 362, fy: 372, s: .84, d: 3.4, cur: [332, 505, 376, 432], grosor: 4.4 },
  { tipo: 'azul',      bx: 126, by: SUELO, fx: 108, fy: 288, s: .78, d: 2.5, cur: [158, 462, 92, 366] },
  { tipo: 'blanco',    bx: 205, by: SUELO, fx: 200, fy: 214, s: 1,   d: 2.1, cur: [232, 432, 174, 306] },
  { tipo: 'azul',      bx: 266, by: SUELO, fx: 288, fy: 322, s: .64, d: 2.9, cur: [250, 486, 300, 400] },
  { tipo: 'blanco',    bx: 300, by: SUELO, fx: 314, fy: 258, s: .74, d: 2.75, cur: [284, 458, 332, 338] }
];

DISENO.forEach((f, idx) => {
  const g = el('g', { class: 'planta' });
  g.style.transformOrigin = `${f.bx}px ${f.by}px`;
  g.style.animationDelay = `-${idx * 1.6}s`;
  g.style.animationDuration = `${8 + (idx % 3)}s`;

  const d = `M${f.bx},${f.by} C ${f.cur[0]},${f.cur[1]} ${f.cur[2]},${f.cur[3]} ${f.fx},${f.fy}`;
  const tallo = el('path', { d, stroke: 'url(#gTallo)', 'stroke-width': f.grosor || 4, class: 'trazo' });
  g.appendChild(tallo);

  requestAnimationFrame(() => {
    const L = tallo.getTotalLength();
    tallo.style.setProperty('--l', L);
    tallo.style.animationDelay = (idx * .14) + 's';

    const esHortensia = f.tipo === 'hortensia';
    [0.38, 0.66].forEach((t, i) => {
      const pt = tallo.getPointAtLength(L * t);
      g.appendChild(hoja(pt.x, pt.y, i === 0 ? -18 : 162, (0.9 - i * .18) * (f.s + .2), f.d - .9 + i * .3, esHortensia));
    });

    g.appendChild(esHortensia ? hortensia(f.fx, f.fy, f.s, f.d) : lirio(f.fx, f.fy, f.s, f.d, f.tipo === 'azul'));
  });

  plantas.appendChild(g);

  // chispas que suben desde el corazón de cada flor
  for (let i = 0; i < 5; i++) {
    const c = el('circle', {
      cx: f.fx + rnd(-14, 14), cy: f.fy + rnd(-8, 8),
      r: rnd(.9, 1.8).toFixed(2),
      fill: f.tipo === 'blanco' ? '#fff8dc' : '#cfe6ff',
      class: 'chispa', filter: 'url(#glowSuave)'
    });
    c.style.setProperty('--d', (f.d + 1.8 + rnd(0, 4)).toFixed(2) + 's');
    chispas.appendChild(c);
  }
});
</script>
</body>
